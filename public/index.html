  AB.toast = (msg, type = "info", ms = 3800) => {
    let box = AB.$(".toasts");
    if (!box) { box = document.createElement("div"); box.className = "toasts"; box.setAttribute("role", "status"); document.body.appendChild(box); }
    const t = document.createElement("div");
    t.className = `toast toast--${type}`;
    t.innerHTML = AB.esc(msg);
    box.appendChild(t);
    requestAnimationFrame(() => t.classList.add("in"));
    setTimeout(() => { t.classList.remove("in"); setTimeout(() => t.remove(), 400); }, ms);
  };

  /* Lien WhatsApp */
  AB.wa = (number, text) => `https://wa.me/${String(number || "").replace(/\D/g, "")}?text=${encodeURIComponent(text || "")}`;

  /* ---------------- Firebase (chargé seulement si configuré) ---------------- */
  let fbPromise = null;
  AB.fb = () => {
    if (!AB.isLive) return Promise.resolve(null);
    if (!fbPromise) {
      const base = `https://www.gstatic.com/firebasejs/${CFG.firebaseSdk}/`;
      fbPromise = Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")])
        .then(([A, Au, F]) => {
          const app = A.initializeApp(CFG.firebase);
          return { app, auth: Au.getAuth(app), db: F.getFirestore(app), Au, F };
        })
        .catch((e) => { console.error("Firebase", e); AB.toast("Connexion à la base de données impossible.", "error"); throw e; });
    }
    return fbPromise;
  };

  /* ---------------- Base de démonstration (navigateur) ---------------- */
  const SEED = { products: () => DEMO.products, collections: () => DEMO.collections };
  const demo = {
    key: (c) => "ab_db2_" + c,
    all(c) {
      let rows = AB.ls.get(this.key(c), null);
      if (!rows) { rows = SEED[c] ? JSON.parse(JSON.stringify(SEED[c]())) : []; AB.ls.set(this.key(c), rows); }
      return rows;
    },
    put(c, doc) {
      const rows = this.all(c);
      const i = rows.findIndex((r) => r.id === doc.id);
      if (i >= 0) rows[i] = { ...rows[i], ...doc }; else rows.unshift(doc);
      if (!AB.ls.set(this.key(c), rows)) throw new Error("Stockage du navigateur plein (mode démo).");
      window.dispatchEvent(new CustomEvent("ab:demo", { detail: c }));
      return doc;
    },
    del(c, id) {
      AB.ls.set(this.key(c), this.all(c).filter((r) => r.id !== id));
      window.dispatchEvent(new CustomEvent("ab:demo", { detail: c }));
    }
  };
  AB.demo = demo;

  /* ---------------- Accès aux données (générique) ---------------- */
  const norm = (snap) => ({ id: snap.id, ...snap.data() });
  AB.store = {
    async list(col, opt = {}) {
      const fb = await AB.fb();
      if (!fb) {
        let rows = demo.all(col).slice();
        if (opt.where) rows = rows.filter((r) => r[opt.where[0]] === opt.where[2]);
        return rows;
      }
      const { F, db } = fb;
      const parts = [F.collection(db, col)];
      if (opt.where) parts.push(F.where(...opt.where));
      if (opt.orderBy) parts.push(F.orderBy(...opt.orderBy));
      if (opt.limit) parts.push(F.limit(opt.limit));
      const snap = await F.getDocs(F.query(...parts));
      return snap.docs.map(norm);
    },
    async get(col, id) {
      const fb = await AB.fb();
      if (!fb) return demo.all(col).find((r) => r.id === id) || null;
      const s = await fb.F.getDoc(fb.F.doc(fb.db, col, id));
      return s.exists() ? norm(s) : null;
    },
    async save(col, id, data) {
      const fb = await AB.fb();
      const doc = { ...data, updatedAt: fb ? fb.F.serverTimestamp() : Date.now() };
      delete doc.id;
      if (!fb) return demo.put(col, { id, ...doc });
      await fb.F.setDoc(fb.F.doc(fb.db, col, id), doc, { merge: true });
      return { id, ...data };
    },
    async add(col, data) {
      const fb = await AB.fb();
      if (!fb) { const id = AB.uid(12); return demo.put(col, { id, ...data, createdAt: Date.now() }); }
      const ref = await fb.F.addDoc(fb.F.collection(fb.db, col), { ...data, createdAt: fb.F.serverTimestamp() });
      return { id: ref.id, ...data };
    },
    async remove(col, id) {
      const fb = await AB.fb();
      if (!fb) return demo.del(col, id);
      await fb.F.deleteDoc(fb.F.doc(fb.db, col, id));
    },
    /* écoute en temps réel (admin) */
    async watch(col, cb, opt = {}) {
      const fb = await AB.fb();
      if (!fb) {
        const run = () => cb(demo.all(col).slice());
        run();
        const h = (e) => { if (!e.detail || e.detail === col) run(); };
        window.addEventListener("ab:demo", h);
        window.addEventListener("storage", run);
        return () => { window.removeEventListener("ab:demo", h); window.removeEventListener("storage", run); };
      }
      const { F, db } = fb;
      const parts = [F.collection(db, col)];
      if (opt.orderBy) parts.push(F.orderBy(...opt.orderBy));
      return F.onSnapshot(F.query(...parts), (s) => cb(s.docs.map(norm)), (e) => { console.error(e); AB.toast("Lecture impossible : " + e.message, "error"); });
    }
  };

  /* ---------------- Contenus du site ---------------- */
  let settingsCache = null, productsCache = null;
  AB.data = {
    categories: DEMO.categories,
    sizeGuide: DEMO.sizeGuide,
    async settings(force) {
      if (settingsCache && !force) return settingsCache;
      let s = null;
      try { s = await AB.store.get("settings", "site"); } catch (e) { console.warn(e); }
      settingsCache = { ...window.AB_DEFAULT_SETTINGS, ...(s || {}) };
      settingsCache.socials = { ...window.AB_DEFAULT_SETTINGS.socials, ...((s && s.socials) || {}) };
      if (!Array.isArray(settingsCache.shipping) || !settingsCache.shipping.length) settingsCache.shipping = window.AB_DEFAULT_SETTINGS.shipping;
      return settingsCache;
    },
    async products(force) {
      if (productsCache && !force) return productsCache;
      let rows = [];
      try { rows = await AB.store.list("products", { where: ["published", "==", true] }); } catch (e) { console.warn(e); }
      if (!rows.length && !AB.isLive) rows = DEMO.products;
      rows.sort((a, b) => (a.order ?? 999) - (b.order ?? 999));
      productsCache = rows;
      return rows;
    },
    async product(slug) {
      const rows = await this.products();
      return rows.find((p) => p.slug === slug || p.id === slug) || null;
    },
    async collections() {
      let rows = [];
      try { rows = await AB.store.list("collections"); } catch (e) { console.warn(e); }
      if (!rows.length && !AB.isLive) rows = DEMO.collections;
      return rows.filter((c) => c.published !== false).sort((a, b) => (a.order ?? 99) - (b.order ?? 99));
    }
  };

  /* ---------------- Envoi de photos (Cloudinary, ou réduction locale en démo) ---------------- */
  AB.upload = async (file, folder = "admirelle-b") => {
    if (!file || !/^image\//.test(file.type)) throw new Error("Choisissez une image (JPG, PNG ou WebP).");
    if (file.size > 12 * 1024 * 1024) throw new Error("Image trop lourde (12 Mo maximum).");
    const cl = CFG.cloudinary || {};
    if (cl.cloudName && cl.uploadPreset) {
      const fd = new FormData();
      fd.append("file", file);
      fd.append("upload_preset", cl.uploadPreset);
      fd.append("folder", folder);
      const r = await fetch(`https://api.cloudinary.com/v1_1/${cl.cloudName}/image/upload`, { method: "POST", body: fd });
      const j = await r.json();
      if (!r.ok) throw new Error((j.error && j.error.message) || "Envoi de l'image impossible.");
      return j.secure_url;
    }
    if (AB.isLive) throw new Error("Cloudinary n'est pas configuré : ajoutez cloudName et uploadPreset dans config.js.");
    // Mode démo : image réduite stockée dans le navigateur
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 900 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.8);
  };

  /* ---------------- Appels aux fonctions serveur ---------------- */
  AB.api = async (name, body, method = "POST") => {
    const headers = { "Content-Type": "application/json" };
    const u = await AB.auth.user();
    if (u && u.getIdToken) headers.Authorization = "Bearer " + (await u.getIdToken());
    const url = `${CFG.functionsBase}/${name}` + (method === "GET" && body ? "?" + new URLSearchParams(body) : "");
    const r = await fetch(url, { method, headers, body: method === "GET" ? undefined : JSON.stringify(body || {}) });
    let j = {};
    try { j = await r.json(); } catch (e) { /* vide */ }
    if (!r.ok) throw new Error(j.error || `Erreur serveur (${r.status}).`);
    return j;
  };

  /* ---------------- Compte cliente ---------------- */
  const listeners = new Set();
  let current = null, ready = false;
  const emit = () => listeners.forEach((cb) => cb(current));
  AB.auth = {
    get current() { return current; },
    onChange(cb) { listeners.add(cb); if (ready) cb(current); return () => listeners.delete(cb); },
    async init() {
      const fb = await AB.fb();
      if (!fb) {
        const s = AB.ls.get("ab_demo_session", null);
        current = s ? { uid: s.uid, email: s.email, displayName: s.name, demo: true } : null;
        ready = true; emit(); return;
      }
      fb.Au.onAuthStateChanged(fb.auth, (u) => { current = u; ready = true; emit(); });
    },
    async user() { return current; },
    async signUp(name, email, password) {
      const fb = await AB.fb();
      if (!fb) {
        const users = AB.ls.get("ab_demo_users", {});
        if (users[email]) throw new Error("Un compte existe déjà avec cette adresse.");
        const uid = "demo_" + AB.uid(10);
        users[email] = { uid, name, password };
        AB.ls.set("ab_demo_users", users);
        AB.ls.set("ab_demo_session", { uid, email, name });
        demo.put("customers", { id: uid, name, email, createdAt: Date.now() });
        current = { uid, email, displayName: name, demo: true }; emit(); return current;
      }
      const cred = await fb.Au.createUserWithEmailAndPassword(fb.auth, email, password);
      await fb.Au.updateProfile(cred.user, { displayName: name });
      await fb.F.setDoc(fb.F.doc(fb.db, "customers", cred.user.uid), { name, email, createdAt: fb.F.serverTimestamp() }, { merge: true });
      current = cred.user; emit(); return current;
    },
    async signIn(email, password) {
      const fb = await AB.fb();
      if (!fb) {
        const u = AB.ls.get("ab_demo_users", {})[email];
        if (!u || u.password !== password) throw new Error("Adresse e-mail ou mot de passe incorrect.");
        AB.ls.set("ab_demo_session", { uid: u.uid, email, name: u.name });
        current = { uid: u.uid, email, displayName: u.name, demo: true }; emit(); return current;
      }
      const cred = await fb.Au.signInWithEmailAndPassword(fb.auth, email, password);
      return cred.user;
    },
    async signOut() {
      const fb = await AB.fb();
      if (!fb) { localStorage.removeItem("ab_demo_session"); current = null; emit(); return; }
      await fb.Au.signOut(fb.auth);
    },
    async reset(email) {
      const fb = await AB.fb();
      if (!fb) throw new Error("Disponible une fois Firebase configuré.");
      await fb.Au.sendPasswordResetEmail(fb.auth, email);
    },
    async profile() {
      if (!current) return null;
      return (await AB.store.get("customers", current.uid)) || { name: current.displayName || "", email: current.email };
    },
    async saveProfile(data) {
      if (!current) throw new Error("Non connectée.");
      const clean = { name: data.name || "", phone: data.phone || "", address: data.address || "", city: data.city || "", email: current.email };
      return AB.store.save("customers", current.uid, clean);
    },
    async orders() {
      if (!current) return [];
      const rows = await AB.store.list("orders", { where: ["uid", "==", current.uid] });
      return rows.sort((a, b) => (AB.toDate(b.createdAt) || 0) - (AB.toDate(a.createdAt) || 0));
    }
  };
  AB.authError = (e) => {
    const m = String((e && (e.code || e.message)) || e);
    if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(m)) return "Adresse e-mail ou mot de passe incorrect.";
    if (/email-already-in-use/.test(m)) return "Un compte existe déjà avec cette adresse.";
    if (/weak-password/.test(m)) return "Le mot de passe doit contenir au moins 6 caractères.";
    if (/invalid-email/.test(m)) return "Adresse e-mail invalide.";
    if (/too-many-requests/.test(m)) return "Trop de tentatives. Réessayez dans quelques minutes.";
    if (/network/.test(m)) return "Connexion internet indisponible.";
    return e && e.message ? e.message : m;
  };

  /* ---------------- Panier ---------------- */
  const CART_KEY = "ab_cart";
  AB.cart = {
    items() { return AB.ls.get(CART_KEY, []); },
    save(items) { AB.ls.set(CART_KEY, items); window.dispatchEvent(new CustomEvent("ab:cart", { detail: items })); },
    add(p, size, color, qty = 1) {
      const items = this.items();
      const key = [p.id, size, color].join("|");
      const it = items.find((i) => i.key === key);
      if (it) it.qty = Math.min(20, it.qty + qty);
      else items.push({ key, id: p.id, slug: p.slug, name: p.name, price: p.price, priceFrom: !!p.priceFrom, image: (p.images || [])[0] || "", size, color, qty });
      this.save(items);
    },
    setQty(key, qty) {
      const items = this.items().map((i) => (i.key === key ? { ...i, qty: Math.max(1, Math.min(20, qty)) } : i));
      this.save(items);
    },
    remove(key) { this.save(this.items().filter((i) => i.key !== key)); },
    clear() { this.save([]); },
    count() { return this.items().reduce((s, i) => s + i.qty, 0); },
    subtotal() { return this.items().reduce((s, i) => s + i.price * i.qty, 0); }
  };

      en_attente_paiement: "En attente de paiement", nouvelle: "Nouvelle", confirmee: "Confirmée", en_confection: "En confection",

    request: { nouvelle: "Nouvelle", devis_envoye: "Devis envoyé", acceptee: "Acceptée", en_confection: "En confection", terminee: "Terminée", annulee: "Annulée" }
  };
})();

  AB.pages.shop = async (params, q) => {
    const all = await AB.data.products();
    const collections = await AB.data.collections();
    const catId = params[0] || "";
    const cat = AB.data.categories.find((c) => c.id === catId);
    const isNew = catId === "nouveautes";
    const base = all.filter((p) => (isNew ? p.isNew : cat ? p.category === cat.id : true));
    const sizes = [...new Set(all.flatMap((p) => p.sizes || []))];
    const order = ["XS", "S", "M", "L", "XL", "XXL", "Sur mesure"];
    sizes.sort((a, b) => order.indexOf(a) - order.indexOf(b));
    const colors = [];
    all.forEach((p) => (p.colors || []).forEach((c) => { if (!colors.find((x) => x.name === c.name)) colors.push(c); }));
    const prices = all.map((p) => p.price);
    const pMin = Math.floor(Math.min(...prices) / 5000) * 5000, pMax = Math.ceil(Math.max(...prices, 50000) / 5000) * 5000;
    const st = {
      sizes: new Set((q.get("taille") || "").split(",").filter(Boolean)),
      colors: new Set((q.get("couleur") || "").split(",").filter(Boolean)),
      cats: new Set((q.get("categorie") || "").split(",").filter(Boolean)),
      coll: q.get("collection") || "",
      min: Number(q.get("min")) || pMin, max: Number(q.get("max")) || pMax,
      sort: q.get("tri") || "selection"
    };
    const title = isNew ? "Nouvelles collections" : cat ? cat.plural : st.coll ? `Collection ${((collections.find((c) => c.id === st.coll) || {}).name) || ""}` : "Toutes les créations";
    const intro = isNew ? "Les dernières pièces sorties de l'atelier." : cat ? cat.intro : st.coll ? ((collections.find((c) => c.id === st.coll) || {}).description || "") : "Pantalons, chemises, ensembles coordonnés et créations sur mesure.";
    const tabs = [["", "Tout"], ["nouveautes", "Nouveautés"], ...AB.data.categories.map((c) => [c.id, c.name])];

    const html = `<section class="phead"><div class="wrap">
      <nav class="crumbs rv" aria-label="Fil d'Ariane"><a href="#/">Accueil</a><span aria-hidden="true">/</span><span>Collections</span></nav>
      <h1 class="h1 rv" style="--d:.06s">${esc(title)}</h1><p class="rv" style="--d:.12s">${esc(intro)}</p></div></section>
      <section class="wrap" style="padding-bottom:clamp(80px,9vw,130px)">
        <div class="tabs">${tabs.map(([id, n]) => `<a href="#/collections${id ? "/" + id : ""}" class="${id === catId ? "is-active" : ""}">${n}</a>`).join("")}</div>
        <div class="shop">
          <aside class="filters" id="filters" aria-label="Filtres">
            <div class="filters__head"><h3 class="h3">Filtrer</h3><button class="tool" id="fclose" aria-label="Fermer">${I.close}</button></div>
            ${!cat && !isNew ? `<div class="fgroup"><h4>Catégorie</h4><div class="checks">${AB.data.categories.map((c) => `<label class="check"><input type="checkbox" name="cat" value="${c.id}" ${st.cats.has(c.id) ? "checked" : ""}>${esc(c.name)}</label>`).join("")}</div></div>` : ""}
            <div class="fgroup"><h4>Collection</h4><div class="checks">
              <label class="check"><input type="radio" name="coll" value="" ${!st.coll ? "checked" : ""}>Toutes</label>
              ${collections.map((c) => `<label class="check"><input type="radio" name="coll" value="${esc(c.id)}" ${st.coll === c.id ? "checked" : ""}>${esc(c.name)}</label>`).join("")}</div></div>
            <div class="fgroup"><h4>Taille</h4><div class="chips">${sizes.map((s) => `<button class="chip ${st.sizes.has(s) ? "is-on" : ""}" data-size="${esc(s)}" aria-pressed="${st.sizes.has(s)}">${esc(s)}</button>`).join("")}</div></div>
            <div class="fgroup"><h4>Couleur</h4><div class="swatches">${colors.map((c) => `<button class="sw ${st.colors.has(c.name) ? "is-on" : ""}" style="--c:${esc(c.hex)}" data-color="${esc(c.name)}" title="${esc(c.name)}" aria-label="${esc(c.name)}" aria-pressed="${st.colors.has(c.name)}"></button>`).join("")}</div></div>
            <div class="fgroup"><h4>Prix</h4>
              <div class="range"><div class="range__track"></div><div class="range__fill" id="rfill"></div>
                <input type="range" id="rmin" min="${pMin}" max="${pMax}" step="1000" value="${st.min}" aria-label="Prix minimum">
                <input type="range" id="rmax" min="${pMin}" max="${pMax}" step="1000" value="${st.max}" aria-label="Prix maximum"></div>
              <div class="range__vals"><span id="vmin"></span><span id="vmax"></span></div></div>
            <div class="fgroup" style="border:0;display:grid;gap:10px"><button class="btn btn--sm btn--block filters__apply" id="fapply">Voir les créations</button><button class="btn btn--ghost btn--sm btn--block" id="freset">Effacer les filtres</button></div>
          </aside>
          <div>
            <div class="shop__bar"><button class="btn btn--ghost btn--sm filter-btn" id="fopen">${I.filter} Filtrer</button><span id="count"></span>
              <label class="select"><span class="sr-only">Trier</span><select id="sort">
                ${[["selection", "Notre sélection"], ["nouveautes", "Nouveautés"], ["prix-asc", "Prix croissant"], ["prix-desc", "Prix décroissant"]].map(([v, t]) => `<option value="${v}" ${st.sort === v ? "selected" : ""}>${t}</option>`).join("")}
              </select></label></div>
            <div class="grid-products grid-products--3" id="grid"></div>
          </div>
        </div>
      </section>`;

    return {
      title: `${title} · Admirelle B`,
      html,
      mount(root) {
        const grid = $("#grid", root), filters = $("#filters", root);
        const rmin = $("#rmin", root), rmax = $("#rmax", root);
        const apply = () => {
          let rows = base.filter((p) =>
            (!st.cats.size || st.cats.has(p.category)) &&
            (!st.coll || p.collection === st.coll) &&
            (!st.sizes.size || (p.sizes || []).some((s) => st.sizes.has(s))) &&
            (!st.colors.size || (p.colors || []).some((c) => st.colors.has(c.name))) &&
            p.price >= st.min && p.price <= st.max);
          if (st.sort === "prix-asc") rows.sort((a, b) => a.price - b.price);
          if (st.sort === "prix-desc") rows.sort((a, b) => b.price - a.price);
          if (st.sort === "nouveautes") rows.sort((a, b) => (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0) || (AB.toDate(b.createdAt) || 0) - (AB.toDate(a.createdAt) || 0));
          $("#count", root).textContent = `${rows.length} création${rows.length > 1 ? "s" : ""}`;
          grid.innerHTML = rows.length ? rows.map((p, i) => AB.card(p, i, "(max-width: 640px) 50vw, (max-width: 1180px) 33vw, 25vw")).join("")
            : `<div class="empty" style="grid-column:1/-1">${AB.mono()}<h3 class="h3">Aucune création ne correspond</h3><p>Essayez d'élargir vos filtres, ou demandez une pièce sur mesure.</p><a class="link" href="#/sur-mesure">Créer sur mesure ${I.arrow}</a></div>`;
          AB.reveal(grid);
          // URL partageable, sans recharger la page
          const p = new URLSearchParams();
          if (st.sizes.size) p.set("taille", [...st.sizes].join(","));
          if (st.colors.size) p.set("couleur", [...st.colors].join(","));
          if (st.cats.size) p.set("categorie", [...st.cats].join(","));
          if (st.coll) p.set("collection", st.coll);
          if (st.min !== pMin) p.set("min", st.min);
          if (st.max !== pMax) p.set("max", st.max);
          if (st.sort !== "selection") p.set("tri", st.sort);
          const h = `#/collections${catId ? "/" + catId : ""}${p.toString() ? "?" + p : ""}`;
          if (AB.getHash() !== h) AB.replaceHash(h);
        };
        const rangeUi = () => {
          if (Number(rmin.value) > Number(rmax.value) - 1000) rmin.value = Number(rmax.value) - 1000;
          st.min = Number(rmin.value); st.max = Number(rmax.value);
          const span = pMax - pMin || 1;
          const f = $("#rfill", root); f.style.left = ((st.min - pMin) / span) * 100 + "%"; f.style.right = 100 - ((st.max - pMin) / span) * 100 + "%";
          $("#vmin", root).textContent = money(st.min); $("#vmax", root).textContent = money(st.max);
        };
        const applyD = AB.debounce(apply, 120);
        [rmin, rmax].forEach((r) => r.addEventListener("input", () => { rangeUi(); applyD(); }));
        root.querySelectorAll("[data-size]").forEach((b) => (b.onclick = () => { const v = b.dataset.size; st.sizes.has(v) ? st.sizes.delete(v) : st.sizes.add(v); b.classList.toggle("is-on"); b.setAttribute("aria-pressed", st.sizes.has(v)); apply(); }));
        root.querySelectorAll("[data-color]").forEach((b) => (b.onclick = () => { const v = b.dataset.color; st.colors.has(v) ? st.colors.delete(v) : st.colors.add(v); b.classList.toggle("is-on"); b.setAttribute("aria-pressed", st.colors.has(v)); apply(); }));
        root.querySelectorAll("input[name=cat]").forEach((c) => (c.onchange = () => { c.checked ? st.cats.add(c.value) : st.cats.delete(c.value); apply(); }));
        root.querySelectorAll("input[name=coll]").forEach((c) => (c.onchange = () => { st.coll = c.value; apply(); }));
        $("#sort", root).onchange = (e) => { st.sort = e.target.value; apply(); };
        $("#freset", root).onclick = () => { AB.replaceHash(`#/collections${catId ? "/" + catId : ""}`); AB.router(); };
        $("#fopen", root).onclick = () => filters.classList.add("open");
        $("#fclose", root).onclick = () => filters.classList.remove("open");
        $("#fapply", root).onclick = () => { filters.classList.remove("open"); grid.scrollIntoView({ behavior: "smooth" }); };
        rangeUi(); apply();
      }
    };
  };

  AB.pages.product = async (params) => {
    const p = await AB.data.product(params[0]);
    if (!p) return AB.pages.notFound();
    const all = await AB.data.products();
    const related = all.filter((x) => x.category === p.category && x.id !== p.id).concat(all.filter((x) => x.category !== p.category && x.id !== p.id)).slice(0, 4);
    const images = p.images && p.images.length ? p.images : [""];
    const st = { size: (p.sizes || []).length === 1 ? p.sizes[0] : "", color: (p.colors || []).length === 1 ? p.colors[0].name : "", qty: 1, i: 0 };
    const soldOut = p.availability === "epuise";
    const delay = p.availability === "sur_commande" ? ` · confection sous ${p.delayDays || 7} jours` : p.stock != null && p.stock <= 3 && p.stock > 0 ? ` · plus que ${p.stock} pièce${p.stock > 1 ? "s" : ""}` : "";
    const html = `<div class="wrap product">

        <div class="gallery__thumbs">${images.map((u, i) => `<button class="${i ? "" : "is-on"}" data-i="${i}" aria-label="Photo ${i + 1}">${u ? `<img src="${esc(img(u, 200))}" alt="">` : ""}</button>`).join("")}</div>
        <div class="gallery__main" id="gmain" role="button" tabindex="0" aria-label="Agrandir la photo">
          ${images.map((u, i) => `<img src="${esc(img(u, 1200))}" ${i === 0 ? 'class="cur" fetchpriority="high"' : 'loading="lazy" style="opacity:0"'} alt="${esc(p.name)}, photo ${i + 1}">`).join("")}
          <span class="gallery__count" id="gcount">01 / ${String(images.length).padStart(2, "0")}</span>
        </div>
      </div>
      <div class="pinfo">
        <nav class="crumbs" aria-label="Fil d'Ariane"><a href="#/">Accueil</a><span aria-hidden="true">/</span><a href="#/collections/${esc(p.category)}">${esc(catName(p.category))}</a><span aria-hidden="true">/</span><span>${esc(p.name)}</span></nav>
        <h1>${esc(p.name)}</h1>
        <div class="price">${p.priceFrom ? "<small>À partir de </small>" : ""}${money(p.price)}</div>
        <div class="avail ${esc(p.availability)}"><i></i>${esc(AB.LABELS.availability[p.availability] || "")}${esc(delay)}</div>
        <p class="short">${esc(p.short)}</p>
        <div class="opt"><div class="opt__head"><span>Couleur <em id="colorName">${esc(st.color)}</em></span></div>
          <div class="swatches">${(p.colors || []).map((c) => `<button class="sw ${st.color === c.name ? "is-on" : ""}" style="--c:${esc(c.hex)}" data-color="${esc(c.name)}" aria-label="${esc(c.name)}" title="${esc(c.name)}"></button>`).join("")}</div></div>
        <div class="opt"><div class="opt__head"><span>Taille <em id="sizeName">${esc(st.size)}</em></span><button type="button" data-size-guide>Guide des tailles</button></div>
          <div class="chips">${(p.sizes || []).map((s) => `<button class="chip ${st.size === s ? "is-on" : ""}" data-size="${esc(s)}">${esc(s)}</button>`).join("")}</div></div>
        <div class="buy">
          <div class="qty"><button data-qty="-1" aria-label="Diminuer">−</button><input id="qty" value="1" inputmode="numeric" aria-label="Quantité"><button data-qty="1" aria-label="Augmenter">+</button></div>
          <button class="btn" id="addCart" ${soldOut ? "disabled" : ""}>${soldOut ? "Épuisé" : "Ajouter au panier"}</button>
          <a class="btn btn--ghost btn--wa" id="waOrder" href="#" target="_blank" rel="noopener">${I.wa} Commander via WhatsApp</a>
        </div>
        <div class="reassure">
          <div>${I.truck}<span>Livraison partout au Bénin</span></div>
          <div>${I.lock}<span>Paiement sécurisé MoMo, Moov, carte</span></div>
          <div>${I.ruler}<span>Ajustements offerts à l'atelier</span></div>
        </div>
        <div class="acc">
          <details open><summary>Description<i></i></summary><div class="acc__body">${AB.nl2p(p.description)}</div></details>
          <details><summary>Confection et finitions<i></i></summary><div class="acc__body"><ul>${(p.details || []).map((d) => `<li>${esc(d)}</li>`).join("")}</ul></div></details>
          <details><summary>Composition et entretien<i></i></summary><div class="acc__body"><p><b style="font-weight:500;color:var(--chocolat)">Composition.</b> ${esc(p.composition)}</p><p style="margin:0"><b style="font-weight:500;color:var(--chocolat)">Entretien.</b> ${esc(p.care || "")}</p></div></details>
          <details><summary>Livraison et retours<i></i></summary><div class="acc__body"><p>Livraison à Cotonou sous 24 à 48 h, partout au Bénin sous 2 à 5 jours, retrait possible à l'atelier. Échange possible sous 7 jours pour les pièces de prêt-à-porter non portées. Les créations sur mesure ne sont ni reprises ni échangées.</p><a class="link" href="#/livraison-retours">En savoir plus ${I.arrow}</a></div></details>
        </div>
      </div>
    </div>
    ${related.length ? `<section class="section section--beige"><div class="wrap"><div class="section-head"><div><span class="kicker">À associer</span><h2 class="h2" style="margin-top:16px">Vous aimerez <em>aussi</em></h2></div></div>
      <div class="grid-products">${related.map((x, i) => AB.card(x, i)).join("")}</div></div></section>` : ""}
    <div id="seenProd"></div>`;

    return {
      title: `${p.name} · Admirelle B`,
      description: p.short,
      html,
      mount(root) {
        const main = $("#gmain", root), imgs = $$("img", main), thumbs = $$(".gallery__thumbs button", root);
        const go = (i) => {
          st.i = (i + images.length) % images.length;
          imgs.forEach((im, k) => { im.style.opacity = k === st.i ? 1 : 0; im.classList.toggle("cur", k === st.i); });
          thumbs.forEach((t, k) => t.classList.toggle("is-on", k === st.i));
          $("#gcount", root).textContent = `${String(st.i + 1).padStart(2, "0")} / ${String(images.length).padStart(2, "0")}`;
        };
        thumbs.forEach((t) => (t.onclick = () => go(Number(t.dataset.i))));
        // zoom au survol (ordinateur) et visionneuse plein écran
        const fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
        if (fine) {
          main.addEventListener("mousemove", (e) => { const r = main.getBoundingClientRect(); imgs[st.i].style.transformOrigin = `${((e.clientX - r.left) / r.width) * 100}% ${((e.clientY - r.top) / r.height) * 100}%`; });
          main.addEventListener("mouseenter", () => main.classList.add("zooming"));
          main.addEventListener("mouseleave", () => main.classList.remove("zooming"));
        }
        main.addEventListener("click", () => AB.openLightbox(images, st.i));
        main.addEventListener("keydown", (e) => { if (e.key === "Enter") AB.openLightbox(images, st.i); if (e.key === "ArrowRight") go(st.i + 1); if (e.key === "ArrowLeft") go(st.i - 1); });
        let x0 = null;
        main.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
        main.addEventListener("touchend", (e) => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) { go(st.i + (dx < 0 ? 1 : -1)); } x0 = null; });

        const qty = $("#qty", root);
        const waUpdate = () => {
          const lines = [`Bonjour Admirelle B, je souhaite commander :`, ``, `• ${p.name}`, `• Couleur : ${st.color || "à préciser"}`, `• Taille : ${st.size || "à préciser"}`, `• Quantité : ${st.qty}`, `• Prix : ${(p.priceFrom ? "à partir de " : "") + money(p.price * st.qty)}`, ``, (AB.memRoute ? "" : location.href.split("?")[0])].filter((x, i, a) => i < a.length - 1 || x);
          $("#waOrder", root).href = AB.wa(S.whatsapp, lines.join("\n"));
        };
        root.querySelectorAll(".pinfo [data-color]").forEach((b) => (b.onclick = () => { st.color = b.dataset.color; root.querySelectorAll(".pinfo [data-color]").forEach((x) => x.classList.toggle("is-on", x === b)); $("#colorName", root).textContent = st.color; waUpdate(); }));
        root.querySelectorAll(".pinfo [data-size]").forEach((b) => (b.onclick = () => { st.size = b.dataset.size; root.querySelectorAll(".pinfo [data-size]").forEach((x) => x.classList.toggle("is-on", x === b)); $("#sizeName", root).textContent = st.size; waUpdate(); }));
        root.querySelectorAll("[data-qty]").forEach((b) => (b.onclick = () => { st.qty = Math.max(1, Math.min(20, st.qty + Number(b.dataset.qty))); qty.value = st.qty; waUpdate(); }));
        qty.onchange = () => { st.qty = Math.max(1, Math.min(20, parseInt(qty.value, 10) || 1)); qty.value = st.qty; waUpdate(); };
        $("#addCart", root).onclick = () => {
          if (!st.color) return AB.toast("Choisissez une couleur.", "error");
          if (!st.size) return AB.toast("Choisissez une taille.", "error");
          AB.cart.add(p, st.size, st.color, st.qty);
          AB.toast(`${p.name} a été ajouté à votre panier.`, "success");
          AB.openCart();
        };
        waUpdate();
        AB.seen.list(p.id).then((seen) => {
          const others = seen.filter((x) => !related.some((r) => r.id === x.id)).slice(0, 4);
          const box = $("#seenProd", root);
          if (box && others.length) { box.outerHTML = `<section class="sec4 seen"><div class="wrap"><div class="head4"><h2 class="t4">Vues récemment</h2></div>
            <div class="grid4">${others.map((x, i) => AB.card(x, i, "(max-width: 640px) 50vw, 25vw")).join("")}</div></div></section>`; AB.reveal(root); }
          AB.seen.add(p.id);
        });
      }
    };
  };

        if (o.hero !== undefined) m.rotation.set(o.rot[0] * 0.15 + Math.sin(time * 0.6 + o.seed) * 0.05, Math.sin(time * 0.5 + o.seed) * 0.25 + (o.hero - 1) * 0.25, o.rot[2]);

    }
  };

      ["Satin", "#6E1F2B", "Lumineux, pour les cérémonies"], ["Gabardine", "#2B211C", "Tenue impeccable pour les tailleurs"], ["Je fournis mon tissu", "#B9694B", "Apportez votre tissu à l'atelier"]];

      <section class="wrap" style="padding-bottom:clamp(60px,7vw,100px)"><div class="steps">${[["Échange", "Vous partagez votre idée, vos envies et l'occasion."], ["Mesures", "Vous envoyez vos mensurations, ou prenez rendez-vous à l'atelier."], ["Tissu", "Vous choisissez la matière et la couleur."], ["Confection", "La pièce est coupée et cousue à vos mesures."], ["Essayage", "Un ou deux essayages pour un ajustement parfait."]]
        .map(([t, d], i) => `<div class="step rv" style="--d:${i * 0.06}s"><b>0${i + 1}</b><h3>${t}</h3><p>${d}</p></div>`).join("")}</div></section>
      <section class="section section--beige" id="devis"><div class="wrap">
        <div class="section-head"><div><span class="kicker">Demande de devis</span><h2 class="h2" style="margin-top:16px">Votre création <em>sur mesure</em></h2></div></div>
        <form class="wizard" id="bespokeForm" novalidate>
          <div class="wizard__nav">${steps.map((t, i) => `<button type="button" data-step="${i}" class="${i ? "" : "is-on"}"><span>${t}</span></button>`).join("")}</div>
          <div>
            <div class="wizard__pane is-on" data-pane="0"><h3>Quel modèle souhaitez-vous ?</h3><p>Partez d'une de nos créations, ou choisissez une création libre.</p>
              <div class="cards">${models.map((p) => `<label class="card-opt"><input type="radio" name="modele" value="${esc(p.name)}" ${pre === p.slug ? "checked" : ""}><div class="ph">${pic(p.images[0], p.name, "200px")}</div><div class="t">${esc(p.name)}<small>${money(p.price)}</small></div></label>`).join("")}
                <label class="card-opt"><input type="radio" name="modele" value="Création libre"><div class="ph" style="display:grid;place-items:center;background:var(--chocolat);color:var(--beige)">${AB.mono()}</div><div class="t">Création libre<small>Décrivez votre idée</small></div></label></div>
              <div class="form" style="margin-top:28px"><label class="field"><span>Type de pièce</span><select name="type"><option>Pantalon</option><option>Chemise</option><option>Ensemble coordonné</option><option>Tailleur</option><option>Robe</option><option>Autre</option></select></label></div>

              <div class="form"><div class="row3">${measures.map(([k, l]) => `<label class="field"><span>${l}</span><input type="number" inputmode="decimal" min="0" max="250" step="0.5" name="m_${k}" placeholder="cm"></label>`).join("")}</div>
                <label class="check"><input type="checkbox" name="rdv" value="oui">Je préfère une prise de mesures à l'atelier, sur rendez-vous</label></div>
            </div>
            <div class="wizard__pane" data-pane="2"><h3>Le tissu</h3><p>La styliste vous conseillera selon le modèle et l'occasion.</p>
              <div class="cards">${fabrics.map(([n, c, d], i) => `<label class="card-opt"><input type="radio" name="tissu" value="${esc(n)}" ${i === 0 ? "checked" : ""}><div class="fabric" style="--c:${c}"></div><div class="t">${esc(n)}<small>${esc(d)}</small></div></label>`).join("")}</div>
              <div class="form" style="margin-top:24px"><label class="field"><span>Couleur souhaitée</span><input name="couleur" placeholder="Ex. chocolat, beige, bordeaux…"></label></div>
            </div>
            <div class="wizard__pane" data-pane="3"><h3>Vos préférences</h3><p>Plus vous en dites, plus la pièce vous ressemblera.</p>
              <div class="form">
                <div class="row"><label class="field"><span>Coupe</span><select name="coupe"><option>Ajustée</option><option>Droite</option><option>Ample et fluide</option><option>Je laisse la styliste me conseiller</option></select></label>
                  <label class="field"><span>Occasion</span><select name="occasion"><option>Quotidien et travail</option><option>Cérémonie ou mariage</option><option>Soirée</option><option>Événement professionnel</option><option>Autre</option></select></label></div>
                <div class="row"><label class="field"><span>Date souhaitée</span><input type="date" name="date"></label>
                  <label class="field"><span>Budget indicatif</span><select name="budget"><option>Moins de 50 000 FCFA</option><option selected>50 000 à 100 000 FCFA</option><option>100 000 à 200 000 FCFA</option><option>Plus de 200 000 FCFA</option></select></label></div>
                <label class="field"><span>Précisions</span><textarea name="details" placeholder="Longueur, détails, manches, col, doublure, inspiration…"></textarea></label>
                <div class="field"><span>Image d'inspiration (facultatif)</span>
                  <label class="drop" id="drop"><input type="file" accept="image/*" id="inspo" hidden><div id="dropIn">${I.upload}<div>Glissez une image ici ou <u>parcourez</u></div><small class="muted">JPG, PNG ou WebP · 12 Mo maximum</small></div></label></div>
              </div>
            </div>
            <div class="wizard__pane" data-pane="4"><h3>Vos coordonnées</h3><p>La styliste vous recontacte sous 48 h avec un devis.</p>
              <div class="form">

                  <label class="field"><span>WhatsApp / téléphone <em>*</em></span><input name="tel" type="tel" autocomplete="tel" placeholder="+229 01 …" required></label></div>
                <div class="row"><label class="field"><span>E-mail</span><input name="email" type="email" autocomplete="email"></label>
                  <label class="field"><span>Ville</span><input name="ville" autocomplete="address-level2"></label></div>
                <label class="check"><input type="checkbox" name="consent" required>J'accepte que mes informations soient utilisées pour traiter ma demande (<a href="#/confidentialite" style="text-decoration:underline">confidentialité</a>).</label>
              </div>
            </div>
            <div class="wizard__actions"><button type="button" class="btn btn--ghost" id="prev">Précédent</button>
              <button type="button" class="btn" id="next">Continuer</button><button type="submit" class="btn btn--terra" id="send" hidden>Envoyer ma demande</button></div>
          </div>
        </form>
      </div></section>`;
    return {
      title: "Sur-mesure · Admirelle B",
      description: "Commandez une pièce sur mesure : choisissez le modèle, indiquez vos mensurations et votre tissu, recevez un devis sous 48 h.",
      html,
      mount(root) {
        const form = $("#bespokeForm", root);
        let step = 0, inspoUrl = "";
        const panes = $$(".wizard__pane", form), navs = $$(".wizard__nav button", form);
        const show = (i) => {
          step = Math.max(0, Math.min(4, i));
          panes.forEach((p, k) => p.classList.toggle("is-on", k === step));
          navs.forEach((b, k) => { b.classList.toggle("is-on", k === step); b.classList.toggle("is-done", k < step); });
          $("#prev", form).style.visibility = step ? "visible" : "hidden";
          $("#next", form).hidden = step === 4; $("#send", form).hidden = step !== 4;
          form.scrollIntoView({ behavior: "smooth", block: "start" });
        };
        navs.forEach((b) => (b.onclick = () => show(Number(b.dataset.step))));
        $("#prev", form).onclick = () => show(step - 1);
        $("#next", form).onclick = () => {
          if (step === 0 && !form.querySelector("input[name=modele]:checked")) return AB.toast("Choisissez un modèle ou « Création libre ».", "error");
          show(step + 1);
        };
        show(0);
        // image d'inspiration
        const drop = $("#drop", form), file = $("#inspo", form), dropIn = $("#dropIn", form);
        const handle = async (f) => {
          if (!f) return;
          dropIn.innerHTML = `<div class="loading" style="min-height:120px">${AB.mono()}</div>`;
          try {
            inspoUrl = await AB.upload(f, "admirelle-b/inspirations");
            dropIn.innerHTML = `<img src="${esc(inspoUrl)}" alt="Votre inspiration"><small class="muted">Image ajoutée · cliquez pour la remplacer</small>`;
          } catch (e) {
            inspoUrl = "";
            dropIn.innerHTML = `${I.upload}<div>${esc(e.message)}</div><small class="muted">Vous pourrez aussi l'envoyer sur WhatsApp.</small>`;
          }
        };
        file.onchange = () => handle(file.files[0]);
        ["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
        ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
        drop.addEventListener("drop", (e) => handle(e.dataTransfer.files[0]));

        form.onsubmit = async (e) => {
          e.preventDefault();
          if (!validate(form, [["nom", (v) => v.length > 1, "Indiquez votre nom."], ["tel", phoneOk, "Numéro WhatsApp invalide."], ["email", (v) => !v || mailOk(v), "Adresse e-mail invalide."]])) return;
          if (!form.elements.consent.checked) return AB.toast("Merci d'accepter l'utilisation de vos informations.", "error");
          const m = {};
          $$("input[name^=m_]", form).forEach((i) => { if (i.value) m[i.name.slice(2)] = Number(i.value); });
          const data = {
            modele: (form.querySelector("input[name=modele]:checked") || {}).value || "", type: val(form, "type"),
            mensurations: m, rdvMesures: form.elements.rdv.checked, tissu: (form.querySelector("input[name=tissu]:checked") || {}).value || "",
            couleur: val(form, "couleur"), coupe: val(form, "coupe"), occasion: val(form, "occasion"), dateSouhaitee: val(form, "date"),
            budget: val(form, "budget"), details: val(form, "details").slice(0, 3000), inspiration: inspoUrl && inspoUrl.startsWith("http") ? inspoUrl : "",
            client: { nom: val(form, "nom"), tel: val(form, "tel"), email: val(form, "email"), ville: val(form, "ville") },
            status: "nouvelle", uid: (AB.auth.current && AB.auth.current.uid) || null
          };
          const btn = $("#send", form); btn.classList.add("is-loading");
          try {
            await AB.store.add("customRequests", data);
            const mtxt = Object.entries(m).map(([k, v]) => `${k} ${v}`).join(", ");
            const wa = AB.wa(S().whatsapp, [`Bonjour Admirelle B, je viens d'envoyer une demande de devis sur mesure.`, ``, `• Modèle : ${data.modele} (${data.type})`, `• Tissu : ${data.tissu}${data.couleur ? ", " + data.couleur : ""}`, `• Coupe : ${data.coupe} · Occasion : ${data.occasion}`, mtxt ? `• Mesures : ${mtxt}` : `• Mesures : à prendre à l'atelier`, data.dateSouhaitee ? `• Pour le : ${data.dateSouhaitee}` : "", ``, `${data.client.nom} · ${data.client.tel}`].filter((x) => x !== null).join("\n"));
            root.querySelector("#devis .wrap").innerHTML = `<div class="confirm" style="padding:40px 0"><div class="seal">${I.check}</div><h2 class="h1">Merci, ${esc(data.client.nom.split(" ")[0])}</h2>
              <p class="muted">Votre demande est bien arrivée à l'atelier. La styliste vous recontacte sous 48 h avec un devis personnalisé.</p>
              <div class="cta__btns" style="display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:28px"><a class="btn btn--terra" href="${wa}" target="_blank" rel="noopener">Envoyer aussi sur WhatsApp</a><a class="btn btn--ghost" href="#/collections">Voir les collections</a></div></div>`;
          } catch (err) {
            console.error(err); AB.toast("Envoi impossible. Réessayez ou écrivez-nous sur WhatsApp.", "error");
          } finally { btn.classList.remove("is-loading"); }
        };
      }
    };
  };

            <label class="optcard ${online ? "" : "is-on"}"><input type="radio" name="pay" value="whatsapp" ${online ? "" : "checked"}><div><b>Commander et confirmer sur WhatsApp</b><small>Votre commande est enregistrée, puis la styliste confirme avec vous les détails et le paiement.</small></div><span style="width:22px;fill:var(--terracotta)">${I.wa}</span></label>
          </div>
          ${online ? "" : `<p class="notice" style="margin-top:16px">Mode démo : le paiement en ligne s'activera dès que FedaPay et Firebase seront configurés (voir le guide d'installation).</p>`}
          <p class="notice" id="quoteNote" hidden style="margin-top:16px">Pour une livraison internationale, les frais sont communiqués après la commande : la confirmation se fait sur WhatsApp.</p>
          </div>
        </div>
        <aside class="summary"><h3>Récapitulatif</h3>${AB.cartLines(items, false)}
          <div class="totals" style="margin-top:18px"><div><span>Sous-total</span><span id="tSub">${money(AB.cart.subtotal())}</span></div><div><span>Livraison</span><span id="tShip"></span></div><div class="grand"><span>Total</span><span id="tTotal"></span></div></div>
          <label class="check" style="margin:22px 0 18px;font-size:13px;align-items:flex-start"><input type="checkbox" name="cgv" style="margin-top:3px">J'ai lu et j'accepte les <a href="#/cgv" target="_blank" style="text-decoration:underline">conditions générales de vente</a>.</label>
          <button class="btn btn--terra btn--block" type="submit" id="payBtn">Payer</button>
          <div class="secure">${I.shield}<span>Paiement traité par FedaPay, plateforme agréée. Vos données bancaires ne transitent jamais par notre site.</span></div>
        </aside>
      </form>`,
      mount(root) {
        const form = $("#checkout", root);
        const zone = () => s.shipping.find((z) => z.id === (form.querySelector("input[name=zone]:checked") || {}).value) || s.shipping[0];
        const pay = () => (form.querySelector("input[name=pay]:checked") || {}).value;
        const refresh = () => {
          const z = zone(), sub = AB.cart.subtotal(), fee = z.quote ? 0 : z.fee;
          $$(".optcard", form).forEach((c) => c.classList.toggle("is-on", c.querySelector("input").checked));
          $("#addr", form).style.display = z.id === "atelier" ? "none" : "";
          const online = $("#payOnline input", form);
          if (z.quote && online) { online.checked = false; online.disabled = true; form.querySelector("input[value=whatsapp]").checked = true; $$(".optcard", form).forEach((c) => c.classList.toggle("is-on", c.querySelector("input").checked)); }
          else if (online && AB.isLive) online.disabled = false;
          $("#quoteNote", form).hidden = !z.quote;
          $("#tShip", form).textContent = z.quote ? "Sur devis" : fee ? money(fee) : "Offerte";
          $("#tTotal", form).textContent = money(sub + fee);
          $("#payBtn", form).textContent = pay() === "fedapay" ? `Payer ${money(sub + fee)}` : "Envoyer ma commande";
        };
        form.addEventListener("change", refresh);
        refresh();
        form.onsubmit = async (e) => {
          e.preventDefault();
          const z = zone();
          const rules = [["nom", (v) => v.length > 1, "Indiquez votre nom."], ["tel", phoneOk, "Numéro invalide."], ["email", mailOk, "Adresse e-mail invalide."]];
          if (z.id !== "atelier") rules.push(["adresse", (v) => v.length > 2, "Indiquez votre adresse."], ["ville", (v) => v.length > 1, "Indiquez votre ville."]);
          if (!validate(form, rules)) return;
          if (!form.elements.cgv.checked) return AB.toast("Merci d'accepter les conditions générales de vente.", "error");
          const customer = { nom: val(form, "nom"), tel: val(form, "tel"), email: val(form, "email"), adresse: val(form, "adresse"), ville: val(form, "ville"), notes: val(form, "notes") };
          const items = AB.cart.items();
          const payload = { items: items.map((i) => ({ id: i.id, size: i.size, color: i.color, qty: i.qty })), customer, zone: z.id, payment: pay() };
          const btn = $("#payBtn", form); btn.classList.add("is-loading");
          // enregistre l'adresse dans l'espace cliente
          if (AB.auth.current) AB.auth.saveProfile({ name: customer.nom, phone: customer.tel, address: customer.adresse, city: customer.ville }).catch(() => {});
          const waText = (num) => [`Bonjour Admirelle B, je viens de passer la commande ${num || ""} :`, ``, ...items.map((i) => `• ${i.name} · ${i.color} · ${i.size} · x${i.qty} · ${money(i.price * i.qty)}`), ``,
            `Livraison : ${z.label}`, `Total : ${money(AB.cart.subtotal() + (z.quote ? 0 : z.fee))}${z.quote ? " + livraison sur devis" : ""}`, ``, `${customer.nom} · ${customer.tel}`, customer.adresse ? `${customer.adresse}, ${customer.ville}` : ""].join("\n");
          try {
            if (AB.isLive) {
              const res = await AB.api("create-order", payload);
              if (payload.payment === "fedapay") { location.href = res.paymentUrl; return; }
              const w = window.open(AB.wa(s.whatsapp, waText(res.number)), "_blank");
              AB.cart.clear();
              AB.go(`#/confirmation?order=${res.orderId}&wa=1&n=${encodeURIComponent(res.number)}${w ? "" : "&open=1"}`);
            } else {
              // mode démo : commande enregistrée dans le navigateur, confirmation sur WhatsApp
              const number = "AB-" + new Date().toISOString().slice(2, 10).replace(/-/g, "") + "-" + AB.uid(4).toUpperCase();
              const sub = AB.cart.subtotal(), fee = z.quote ? 0 : z.fee;
              const order = await AB.store.add("orders", { number, uid: (AB.auth.current && AB.auth.current.uid) || null, customer, items: items.map(({ key, ...r }) => r), subtotal: sub, shippingFee: fee, total: sub + fee, zone: z.id, zoneLabel: z.label, payment: { method: "whatsapp", status: "a_confirmer" }, status: "nouvelle" });
              try { window.open(AB.wa(s.whatsapp, waText(number)), "_blank"); } catch (e) { /* aperçu */ }
              AB.cart.clear();
              AB.go(`#/confirmation?order=${order.id}&wa=1&n=${encodeURIComponent(number)}`);
            }
          } catch (err) {
            console.error(err); AB.toast(err.message || "La commande n'a pas pu être enregistrée.", "error");
          } finally { btn.classList.remove("is-loading"); }
        };
      }
    };
  };

  AB.pages.confirmation = async (params, q) => {
    const orderId = q.get("order") || "";
    const s = S();
    const ok = (o) => `<div class="seal">${I.check}</div><span class="kicker kicker--plain">Commande ${esc(o.number || "")}</span>
      <h1 class="h1" style="margin-top:14px">Merci pour votre commande</h1>
      <p class="muted">Votre paiement de ${money(o.total)} a bien été reçu. Vous allez recevoir une confirmation par e-mail, et la styliste vous contacte pour la livraison.</p>
      ${o.items ? `<div class="box">${o.items.map((i) => `<div class="line" style="grid-template-columns:1fr auto"><div><div class="line__name">${esc(i.name)}</div><div class="line__meta">${esc(i.color)} · ${esc(i.size)} · x${i.qty}</div></div><span>${money(i.price * i.qty)}</span></div>`).join("")}
        <div class="totals" style="margin-top:16px"><div><span>Livraison</span><span>${money(o.shippingFee || 0)}</span></div><div class="grand"><span>Total payé</span><span>${money(o.total)}</span></div></div></div>` : ""}
      <div style="display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:32px"><a class="btn" href="#/compte">Suivre ma commande</a><a class="btn btn--ghost" href="#/collections">Continuer mes achats</a></div>`;
    if (q.get("wa")) {
      const n = q.get("n") || "";
      return {
        title: "Commande envoyée · Admirelle B",
        html: `<div class="wrap confirm"><div class="seal">${I.wa.replace("<svg", '<svg style="width:40px;height:40px;fill:currentColor"')}</div><span class="kicker kicker--plain">Commande ${esc(n)}</span>
          <h1 class="h1" style="margin-top:14px">Commande enregistrée</h1><p class="muted">Votre commande a été transmise à la styliste. Finalisez-la sur WhatsApp : elle vous confirmera la disponibilité, la livraison et le paiement.</p>
          <div style="display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:32px"><a class="btn btn--terra" href="${AB.wa(s.whatsapp, `Bonjour Admirelle B, je souhaite confirmer ma commande ${n}.`)}" target="_blank" rel="noopener">Ouvrir WhatsApp</a><a class="btn btn--ghost" href="#/collections">Continuer mes achats</a></div></div>`
      };
    }
    return {
      title: "Paiement · Admirelle B",
      html: `<div class="wrap confirm" id="conf"><div class="loading">${AB.mono()}</div><p class="muted">Vérification de votre paiement…</p></div>`,
      async mount(root) {
        const box = $("#conf", root);
        let tries = 0;
        const check = async () => {
          tries++;
          let o;
          try { o = await AB.api("verify-payment", { order: orderId }, "GET"); }
          catch (e) { box.innerHTML = `<div class="seal fail">${AB.mono()}</div><h1 class="h1">Vérification impossible</h1><p class="muted">${esc(e.message)}</p><a class="btn" href="${AB.wa(s.whatsapp, "Bonjour, je n'arrive pas à vérifier mon paiement. Commande : " + orderId)}" target="_blank" rel="noopener">Nous contacter</a>`; return; }
          if (o.paymentStatus === "payee") { AB.cart.clear(); box.innerHTML = ok(o); return; }
          if (o.paymentStatus === "echouee") {
            box.innerHTML = `<div class="seal fail">${AB.mono()}</div><h1 class="h1">Paiement non abouti</h1><p class="muted">Le paiement de la commande ${esc(o.number)} a été annulé ou refusé. Votre panier est conservé : vous pouvez réessayer ou commander sur WhatsApp.</p>
              <div style="display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:28px"><a class="btn btn--terra" href="#/commande">Réessayer le paiement</a><a class="btn btn--ghost" href="${AB.wa(s.whatsapp, "Bonjour, mon paiement n'a pas abouti pour la commande " + o.number)}" target="_blank" rel="noopener">Aide sur WhatsApp</a></div>`;
            return;
          }
          if (tries < 6) { setTimeout(check, 4000); return; }
          box.innerHTML = `<div class="seal">${I.clock}</div><h1 class="h1">Paiement en cours de validation</h1><p class="muted">Votre opérateur n'a pas encore confirmé le paiement de la commande ${esc(o.number)}. Validez la demande sur votre téléphone si besoin : la commande sera confirmée automatiquement.</p>
            <button class="btn" id="again">Vérifier à nouveau</button>`;
          $("#again", box).onclick = () => { tries = 0; box.innerHTML = `<div class="loading">${AB.mono()}</div>`; check(); };
        };
        check();
      }
    };
  };

  AB.pages.account = async () => {
    await new Promise((r) => { const off = AB.auth.onChange(() => { setTimeout(() => off && off(), 0); r(); }); });
    const user = AB.auth.current;
    if (!user) return {
      title: "Mon compte · Admirelle B",
      html: `<section class="phead"><div class="wrap"><span class="kicker">Espace cliente</span><h1 class="h1" style="margin-top:16px">Bienvenue</h1><p>Retrouvez vos commandes, suivez leur avancement et commandez plus vite.</p></div></section>
        <div class="wrap auth">
          <form class="box form" id="login" novalidate><h3>Se connecter</h3>
            <label class="field"><span>E-mail</span><input name="email" type="email" autocomplete="email"></label>
            <label class="field"><span>Mot de passe</span><input name="pw" type="password" autocomplete="current-password"></label>
            <button class="btn" type="submit">Se connecter</button><button type="button" class="link" id="forgot" style="justify-self:start">Mot de passe oublié ?</button></form>

        </div>`,
      mount(root) {
        const login = $("#login", root), signup = $("#signup", root);
        login.onsubmit = async (e) => {
          e.preventDefault();
          if (!validate(login, [["email", mailOk, "Adresse e-mail invalide."], ["pw", (v) => v.length >= 6, "Mot de passe trop court."]])) return;
          const b = login.querySelector("[type=submit]"); b.classList.add("is-loading");
          try { await AB.auth.signIn(val(login, "email"), login.elements.pw.value); AB.toast("Heureuse de vous revoir.", "success"); AB.router(); }
          catch (err) { AB.toast(AB.authError(err), "error"); } finally { b.classList.remove("is-loading"); }
        };
        signup.onsubmit = async (e) => {
          e.preventDefault();
          if (!validate(signup, [["nom", (v) => v.length > 1, "Indiquez votre nom."], ["email", mailOk, "Adresse e-mail invalide."], ["pw", (v) => v.length >= 6, "6 caractères minimum."]])) return;
          const b = signup.querySelector("[type=submit]"); b.classList.add("is-loading");
          try { await AB.auth.signUp(val(signup, "nom"), val(signup, "email"), signup.elements.pw.value); AB.toast("Votre compte est créé.", "success"); AB.router(); }
          catch (err) { AB.toast(AB.authError(err), "error"); } finally { b.classList.remove("is-loading"); }
        };
        $("#forgot", root).onclick = async () => {
          const em = val(login, "email");
          if (!mailOk(em)) { fieldErr(login, "email", "Saisissez d'abord votre e-mail."); return; }
          try { await AB.auth.reset(em); AB.toast("Un lien de réinitialisation vous a été envoyé.", "success"); } catch (err) { AB.toast(AB.authError(err), "error"); }
        };
      }
    };
    const [orders, prof] = await Promise.all([AB.auth.orders().catch((e) => { console.error(e); return []; }), AB.auth.profile()]);
    const pillCls = (st) => (["livree", "confirmee", "payee", "prete", "expediee"].includes(st) ? "pill--ok" : ["annulee", "echouee"].includes(st) ? "pill--bad" : "pill--wait");
    return {
      title: "Mon compte · Admirelle B",
      html: `<section class="phead"><div class="wrap"><span class="kicker">Espace cliente</span><h1 class="h1" style="margin-top:16px">Bonjour ${esc((prof && prof.name) || user.displayName || "")}</h1></div></section>

          <div>
            <div data-panel="orders">${orders.length ? orders.map((o) => `<details class="order"><summary><div><b style="font-weight:500;color:var(--chocolat)">${esc(o.number)}</b><div class="small muted">${AB.date(o.createdAt)}</div></div>
              <span class="hide-sm">${money(o.total)}</span><span class="hide-sm"><span class="pill ${pillCls(o.payment && o.payment.status)}">${esc(AB.LABELS.payment[(o.payment || {}).status] || "")}</span></span><span class="pill ${pillCls(o.status)}">${esc(AB.LABELS.status[o.status] || o.status)}</span></summary>
              <div class="order__body">${(o.items || []).map((i) => `<div class="line" style="grid-template-columns:1fr auto"><div><div class="line__name">${esc(i.name)}</div><div class="line__meta">${esc(i.color)} · ${esc(i.size)} · x${i.qty}</div></div><span>${money(i.price * i.qty)}</span></div>`).join("")}
                <div class="totals" style="margin-top:14px"><div><span>Livraison · ${esc(o.zoneLabel || "")}</span><span>${money(o.shippingFee || 0)}</span></div><div class="grand"><span>Total</span><span>${money(o.total)}</span></div></div>
                ${o.payment && o.payment.status === "en_attente" && o.payment.method === "fedapay" ? `<p class="notice" style="margin-top:16px">Paiement non finalisé. <a href="#/confirmation?order=${esc(o.id)}" style="text-decoration:underline">Vérifier le paiement</a></p>` : ""}
              </div></details>`).join("") : `<div class="empty">${AB.mono()}<h3 class="h3">Aucune commande pour l'instant</h3><p>Vos commandes apparaîtront ici.</p><a class="btn" href="#/collections">Découvrir la collection</a></div>`}</div>
            <form class="box form" data-panel="profile" hidden id="profile" novalidate><h3>Mes informations</h3>

              <button class="btn" type="submit">Enregistrer</button></form>
          </div>
        </div>`,
      mount(root) {

          catch (err) { AB.toast(err.message, "error"); }

      }

  };
