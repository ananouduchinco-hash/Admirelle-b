<style>
/* =====================================================================
   ADMIRELLE B — FEUILLE DE STYLE DU SITE
   Palette : chocolat #4A2E24 · beige #E8D8C3 · terracotta #B9694B · crème #F7F2EA · brun #2B211C
   Typographies : Cormorant Garamond (titres) · Jost (textes)
   ===================================================================== */
:root {
  --chocolat: #4A2E24;
  --beige: #E8D8C3;
  --terracotta: #B9694B;
  --creme: #F7F2EA;
  --brun: #2B211C;
  --terracotta-d: #9E5539;
  --beige-d: #D9C6AD;
  --ink: #3A2A23;
  --muted: #7C685D;
  --line: rgba(74, 46, 36, .14);
  --line-strong: rgba(74, 46, 36, .28);
  --white: #FFFDF9;
  --serif: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --sans: "Jost", "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.22, .61, .36, 1);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --wrap: 1360px;
  --gut: clamp(20px, 4vw, 56px);
  --header-h: 84px;
  --radius: 2px;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--creme); color: var(--ink);
  font: 300 16px/1.7 var(--sans); letter-spacing: .01em;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  font-variant-numeric: lining-nums;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, select, textarea { font: inherit; color: inherit; }
::selection { background: var(--terracotta); color: var(--creme); }
:focus-visible { outline: 1.5px solid var(--terracotta); outline-offset: 3px; }
[hidden] { display: none !important; }
.sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--chocolat); color: var(--creme); padding: 10px 16px; z-index: 999; }
.skip:focus { left: 8px; }

/* ---------- typographie ---------- */
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 400; color: var(--chocolat); margin: 0; line-height: 1.08; letter-spacing: -.005em; }
.display { font-size: clamp(48px, 7.2vw, 112px); font-weight: 300; line-height: .98; letter-spacing: -.02em; }
.h1 { font-size: clamp(40px, 5.2vw, 76px); font-weight: 300; }
.h2 { font-size: clamp(32px, 3.8vw, 54px); font-weight: 300; }
.h3 { font-size: clamp(24px, 2.2vw, 32px); }
.display em, .h1 em, .h2 em { font-style: italic; color: var(--terracotta); }
.kicker {
  display: inline-flex; align-items: center; gap: 14px; font: 500 11.5px/1.4 var(--sans);
  letter-spacing: .32em; text-transform: uppercase; color: var(--terracotta);
}
.kicker::before { content: ""; width: 34px; height: 1px; background: currentColor; }
.kicker--plain::before { display: none; }
.lead { font: italic 300 clamp(20px, 1.8vw, 25px)/1.5 var(--serif); color: var(--chocolat); }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.caps { text-transform: uppercase; letter-spacing: .2em; font-size: 12px; font-weight: 500; }
p { margin: 0 0 1em; }

/* ---------- mise en page ---------- */
.wrap { width: 100%; max-width: var(--wrap); margin: 0 auto; padding: 0 var(--gut); }
.section { padding: clamp(80px, 11vw, 160px) 0; }
.section--tight { padding: clamp(56px, 7vw, 96px) 0; }
.section--beige { background: var(--beige); }
.section--dark { background: var(--brun); color: var(--beige); }
.section--dark h2, .section--dark h3 { color: var(--creme); }
.section--choco { background: var(--chocolat); color: var(--beige); }
.section--choco h2, .section--choco h3 { color: var(--creme); }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; margin-bottom: clamp(40px, 5vw, 72px); flex-wrap: wrap; }
.section-head .h2 { margin-top: 18px; max-width: 16ch; }
.stack > * + * { margin-top: 24px; }

/* ---------- boutons ---------- */
.btn {
  --bg: var(--chocolat); --fg: var(--creme);
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  min-height: 54px; padding: 0 34px; background: var(--bg); color: var(--fg);
  font: 500 12px/1 var(--sans); letter-spacing: .26em; text-transform: uppercase;
  border: 1px solid var(--bg); border-radius: var(--radius); overflow: hidden; isolation: isolate;
  transition: color .45s var(--ease), border-color .45s var(--ease), transform .2s var(--ease);
}
.btn::after {
  content: ""; position: absolute; inset: 0; background: var(--brun); z-index: -1;
  transform: scaleX(0); transform-origin: right; transition: transform .55s var(--ease-out);
}
.btn:hover::after { transform: scaleX(1); transform-origin: left; }
.btn:active { transform: translateY(1px); }
.btn--terra { --bg: var(--terracotta); }
.btn--terra::after { background: var(--chocolat); }
.btn--light { --bg: var(--creme); --fg: var(--chocolat); }
.btn--light::after { background: var(--beige); }
.btn--ghost { --bg: transparent; --fg: var(--chocolat); border-color: var(--line-strong); }
.btn--ghost::after { background: var(--chocolat); }
.btn--ghost:hover { color: var(--creme); border-color: var(--chocolat); }
.section--dark .btn--ghost, .section--choco .btn--ghost { --fg: var(--beige); border-color: rgba(232, 216, 195, .35); }
.section--dark .btn--ghost::after, .section--choco .btn--ghost::after { background: var(--beige); }
.section--dark .btn--ghost:hover, .section--choco .btn--ghost:hover { color: var(--chocolat); }
.btn--block { width: 100%; }
.btn--sm { min-height: 44px; padding: 0 22px; font-size: 11px; }
.btn[disabled], .btn.is-loading { opacity: .55; pointer-events: none; }
.btn.is-loading::before {
  content: ""; width: 14px; height: 14px; border: 1.5px solid currentColor; border-right-color: transparent;
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.link {
  display: inline-flex; align-items: center; gap: 12px; font: 500 12px/1 var(--sans); letter-spacing: .26em;
  text-transform: uppercase; color: var(--chocolat); padding: 6px 0; background: linear-gradient(currentColor, currentColor) 0 100% / 100% 1px no-repeat;
  transition: background-size .5s var(--ease-out), gap .4s var(--ease);
}
.link:hover { background-size: 0 1px; background-position: 100% 100%; gap: 18px; }
.link svg { width: 18px; height: 10px; }
.section--dark .link, .section--choco .link { color: var(--beige); }
.icon { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.25; }

/* ---------- bandeau d'annonce et en-tête ---------- */
.announce {
  background: var(--brun); color: var(--beige); text-align: center; font: 400 11.5px/1.4 var(--sans);
  letter-spacing: .18em; text-transform: uppercase; padding: 10px var(--gut);
}
.header {
  position: sticky; top: 0; z-index: 50; height: var(--header-h);
  background: rgba(247, 242, 234, .86); backdrop-filter: saturate(1.2) blur(14px); -webkit-backdrop-filter: saturate(1.2) blur(14px);
  border-bottom: 1px solid transparent; transition: border-color .4s, background .4s, height .4s var(--ease);
}
.header.is-scrolled { border-bottom-color: var(--line); --header-h: 70px; }
.header__in { height: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px; }
.brand { display: inline-flex; align-items: center; gap: 14px; color: var(--chocolat); justify-self: center; }
.brand svg.mono { width: 40px; height: 44px; transition: width .4s var(--ease), height .4s var(--ease); }
.brand svg.word { width: 158px; height: 15px; }
.header.is-scrolled .brand svg.mono { width: 34px; height: 37px; }
.nav { display: flex; gap: clamp(18px, 2.4vw, 40px); }
.nav a {
  position: relative; white-space: nowrap; font: 400 11.5px/1 var(--sans); letter-spacing: .24em; text-transform: uppercase; padding: 10px 0; color: var(--chocolat);
}
.nav a::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 2px; height: 1px; background: var(--terracotta);
  transform: scaleX(0); transform-origin: right; transition: transform .45s var(--ease-out);
}
.nav a:hover::after, .nav a.is-active::after { transform: scaleX(1); transform-origin: left; }
.nav a.is-active { color: var(--terracotta); }
.tools { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
.tool { position: relative; width: 44px; height: 44px; display: grid; place-items: center; color: var(--chocolat); border-radius: 50%; transition: background .3s; }
.tool:hover { background: rgba(74, 46, 36, .06); }
.tool .badge {
  position: absolute; top: 5px; right: 3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--terracotta); color: var(--creme); font: 500 10px/18px var(--sans); text-align: center; letter-spacing: 0;
  transform: scale(0); transition: transform .35s var(--ease-out);
}
.tool .badge.on { transform: scale(1); }
.tool .badge.bump { animation: bump .5s var(--ease-out); }
@keyframes bump { 40% { transform: scale(1.35); } }
.burger { display: none; }
.burger span { display: block; width: 24px; height: 1px; background: currentColor; transition: transform .4s var(--ease); }
.burger span + span { margin-top: 7px; }

/* menu mobile */
.mmenu {
  position: fixed; inset: 0; z-index: 80; background: var(--brun); color: var(--beige);
  display: flex; flex-direction: column; padding: 28px var(--gut) 40px;
  clip-path: inset(0 0 100% 0); visibility: hidden; transition: clip-path .7s var(--ease-out), visibility 0s .7s;
}
.mmenu.open { clip-path: inset(0 0 0 0); visibility: visible; transition: clip-path .7s var(--ease-out); }
.mmenu__top { display: flex; justify-content: space-between; align-items: center; }
.mmenu__top svg.mono { width: 38px; height: 42px; color: var(--beige); }
.mmenu nav { margin: auto 0; display: flex; flex-direction: column; gap: 6px; }
.mmenu nav a {
  font: 300 clamp(40px, 11vw, 64px)/1.15 var(--serif); color: var(--creme); opacity: 0; transform: translateY(24px);
  transition: opacity .6s var(--ease), transform .7s var(--ease-out), color .3s;
}
.mmenu nav a:hover, .mmenu nav a.is-active { color: var(--terracotta); font-style: italic; }
.mmenu.open nav a { opacity: 1; transform: none; }
.mmenu.open nav a:nth-child(2) { transition-delay: .06s; } .mmenu.open nav a:nth-child(3) { transition-delay: .12s; }
.mmenu.open nav a:nth-child(4) { transition-delay: .18s; } .mmenu.open nav a:nth-child(5) { transition-delay: .24s; }
.mmenu.open nav a:nth-child(6) { transition-delay: .3s; }
.mmenu__foot { display: flex; flex-wrap: wrap; gap: 14px 28px; font-size: 13px; letter-spacing: .1em; color: rgba(232, 216, 195, .75); }

/* ---------- transitions de page et apparitions ---------- */
#view { min-height: 70vh; }
#view.leave { opacity: 0; transform: translateY(10px); transition: opacity .25s var(--ease), transform .25s var(--ease); }
#view.enter { animation: pageIn .7s var(--ease-out); }
@keyframes pageIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.rv { opacity: 0; transform: translateY(36px); transition: opacity 1s var(--ease), transform 1.2s var(--ease-out); transition-delay: var(--d, 0s); }
.rv.in { opacity: 1; transform: none; }
.rv-img { overflow: hidden; }
.rv-img img { transform: scale(1.12); transition: transform 1.8s var(--ease-out); }
.rv-img.in img { transform: scale(1); }
.mask { clip-path: inset(0 0 100% 0); transition: clip-path 1.2s var(--ease-out); transition-delay: var(--d, 0s); }
.mask.in { clip-path: inset(0 0 0 0); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  .rv, .mask { opacity: 1; transform: none; clip-path: none; }
}

/* ---------- images ---------- */
.ph { position: relative; background: var(--beige); overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; }
.ph--34 { aspect-ratio: 3 / 4; }
.ph--45 { aspect-ratio: 4 / 5; }
.ph--23 { aspect-ratio: 2 / 3; }
.ph--wide { aspect-ratio: 16 / 10; }
.ph::after { /* filtre chaud discret, cohérent avec la palette */
  content: ""; position: absolute; inset: 0; pointer-events: none; background: rgba(74, 46, 36, .04); mix-blend-mode: multiply;
}

/* ---------- accueil : hero ---------- */
.hero { position: relative; padding: clamp(28px, 4vw, 56px) 0 clamp(64px, 8vw, 120px); overflow: hidden; }
.hero__grid { display: grid; grid-template-columns: 1.02fr .98fr; gap: clamp(32px, 6vw, 96px); align-items: center; }
.hero__text { position: relative; z-index: 2; padding-top: 20px; }
.hero__text .display { margin: 26px 0 30px; }
.hero__text .display span { display: block; }
.hero__text p.intro { max-width: 46ch; color: var(--muted); font-size: 17px; margin-bottom: 40px; }
.hero__ctas { display: flex; flex-wrap: wrap; gap: 18px 28px; align-items: center; }
.hero__media { position: relative; }
.hero__media .ph { aspect-ratio: 4 / 5; }
.hero__media .ph img { transform-origin: 50% 30%; }
.hero__badge {
  position: absolute; left: -48px; bottom: 56px; z-index: 3; width: 150px; height: 150px; border-radius: 50%;
  background: var(--terracotta); color: var(--creme); display: grid; place-items: center; text-align: center;
}
.hero__badge svg.mono { width: 54px; height: 60px; color: var(--creme); }
.hero__badge .ring { position: absolute; inset: 0; animation: spin 26s linear infinite; }
.hero__badge .ring text { font: 500 9.6px var(--sans); letter-spacing: .32em; fill: var(--creme); text-transform: uppercase; }
.hero__caption { position: absolute; right: 0; bottom: -34px; font: italic 300 15px var(--serif); color: var(--muted); }
.hero__water { position: absolute; left: -7vw; bottom: -2vw; width: 36vw; height: 40vw; max-width: 560px; max-height: 620px; color: var(--beige); opacity: .32; z-index: 0; pointer-events: none; }
.scroll-cue { display: flex; align-items: center; gap: 14px; margin-top: 64px; font: 500 10.5px var(--sans); letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
.scroll-cue i { position: relative; width: 1px; height: 46px; background: var(--line); overflow: hidden; }
.scroll-cue i::after { content: ""; position: absolute; left: 0; top: -50%; width: 1px; height: 50%; background: var(--terracotta); animation: cue 2.2s var(--ease) infinite; }
@keyframes cue { to { top: 100%; } }

/* manifeste */
.manifesto { text-align: center; max-width: 980px; margin: 0 auto; }
.manifesto p { font: 300 clamp(26px, 3.3vw, 46px)/1.3 var(--serif); color: var(--chocolat); margin: 30px 0 0; }
.manifesto p em { color: var(--terracotta); }
.cats-strip { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px 36px; margin-top: 44px; }
.cats-strip a { font: 400 12px var(--sans); letter-spacing: .26em; text-transform: uppercase; color: var(--muted); transition: color .3s; }
.cats-strip a:hover { color: var(--terracotta); }

/* ---------- cartes produit ---------- */
.grid-products { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(28px, 3vw, 44px) clamp(16px, 2vw, 28px); }
.grid-products--3 { grid-template-columns: repeat(3, 1fr); }
.pcard { position: relative; display: block; }
.pcard__wrap { position: relative; overflow: hidden; }
.pcard__media { position: relative; display: block; aspect-ratio: 3 / 4; background: var(--beige); overflow: hidden; }
.pcard__media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; transition: opacity .8s var(--ease), transform 1.4s var(--ease-out); }
.pcard__media img.alt { opacity: 0; }
.pcard:hover .pcard__media img { transform: scale(1.045); }
.pcard:hover .pcard__media img.alt { opacity: 1; }
.pcard__tag {
  position: absolute; top: 14px; left: 14px; z-index: 2; background: var(--creme); color: var(--chocolat);
  font: 500 10px/1 var(--sans); letter-spacing: .24em; text-transform: uppercase; padding: 8px 10px;
}
.pcard__tag--terra { background: var(--terracotta); color: var(--creme); }
.pcard__quick {
  position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 2; background: rgba(247, 242, 234, .94);
  color: var(--chocolat); text-align: center; padding: 14px; font: 500 11px/1 var(--sans); letter-spacing: .24em; text-transform: uppercase;
  transform: translateY(calc(100% + 14px)); transition: transform .55s var(--ease-out), background .3s;
}
.pcard__quick:hover { background: var(--chocolat); color: var(--creme); }
.pcard:hover .pcard__quick, .pcard:focus-within .pcard__quick { transform: none; }
.pcard__body { padding-top: 18px; display: flex; justify-content: space-between; gap: 14px; align-items: baseline; }
.pcard__name { font: 400 21px/1.2 var(--serif); color: var(--chocolat); }
.pcard__cat { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.pcard__price { font: 400 14px var(--sans); color: var(--chocolat); white-space: nowrap; }
.pcard__price small { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.swatches-mini { display: flex; gap: 6px; margin-top: 10px; }
.swatches-mini i { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--line-strong); }

/* rangée défilante (dernières créations) */
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 3 * 28px) / 4); gap: 28px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 6px; }
.rail::-webkit-scrollbar { display: none; }
.rail > * { scroll-snap-align: start; }
.rail-nav { display: flex; gap: 10px; }
.rail-nav button { width: 52px; height: 52px; border: 1px solid var(--line-strong); border-radius: 50%; display: grid; place-items: center; color: var(--chocolat); transition: background .3s, color .3s, border-color .3s; }
.rail-nav button:hover { background: var(--chocolat); color: var(--creme); border-color: var(--chocolat); }
.rail-nav svg { width: 18px; height: 10px; }

/* blocs catégories asymétriques */
.feature { display: grid; grid-template-columns: 7fr 5fr; gap: clamp(32px, 6vw, 100px); align-items: center; }
.feature--rev { grid-template-columns: 5fr 7fr; }
.feature--rev .feature__media { order: 2; }
.feature__media { position: relative; }
.feature__media .ph { aspect-ratio: 5 / 6; }
.feature__media .num { position: absolute; top: -0.5em; right: 6%; font: 200 clamp(80px, 10vw, 160px)/1 var(--sans); color: var(--terracotta); opacity: .9; z-index: 2; }
.feature--rev .feature__media .num { right: auto; left: 6%; }
.feature__text .h2 { margin: 22px 0 24px; }
.feature__text > p { color: var(--muted); max-width: 42ch; }
.feature__mini { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin: 36px 0 40px; }
.feature__mini .pcard__name { font-size: 18px; }
.feature__mini .pcard__quick { display: none; }

/* savoir-faire */
.craft { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(40px, 7vw, 110px); align-items: center; }
.craft__media { position: relative; }
.craft__media .ph { aspect-ratio: 4 / 5; }
.craft__media .ph + .ph { position: absolute; width: 46%; aspect-ratio: 3 / 4; right: -9%; bottom: -12%; border: 10px solid var(--brun); }
.craft__list { margin-top: 48px; border-top: 1px solid rgba(232, 216, 195, .18); }
.craft__item { display: grid; grid-template-columns: 70px 1fr; gap: 16px; padding: 26px 0; border-bottom: 1px solid rgba(232, 216, 195, .18); }
.craft__item b { font: 200 28px/1 var(--sans); color: var(--terracotta); }
.craft__item h3 { font-size: 26px; margin-bottom: 6px; }
.craft__item p { margin: 0; color: rgba(232, 216, 195, .78); font-size: 15px; }

/* collections */
.colls { display: grid; grid-template-columns: 1.15fr .85fr .85fr; gap: clamp(16px, 2vw, 28px); align-items: end; }
.coll { position: relative; display: block; color: var(--creme); }
.coll .ph { aspect-ratio: 3 / 4; }
.coll:first-child .ph { aspect-ratio: 4 / 5; }
.coll .ph img { transition: transform 1.6s var(--ease-out); }
.coll:hover .ph img { transform: scale(1.06); }
.coll .ph::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(43, 33, 28, 0) 45%, rgba(43, 33, 28, .72)); }
.coll__txt { position: absolute; left: 28px; right: 28px; bottom: 26px; z-index: 2; }
.coll__txt small { font: 500 10.5px var(--sans); letter-spacing: .3em; text-transform: uppercase; color: var(--beige); }
.coll__txt h3 { color: var(--creme); font-size: clamp(30px, 3vw, 44px); font-weight: 300; margin-top: 8px; }
.coll__txt p { color: rgba(247, 242, 234, .82); font-size: 14px; margin: 8px 0 0; max-width: 34ch; }

/* valeurs */
.values { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); }
.value { padding: 40px 28px 10px 0; border-right: 1px solid var(--line); }
.value + .value { padding-left: 28px; }
.value:last-child { border-right: 0; }
.value b { font: 500 11px var(--sans); letter-spacing: .3em; color: var(--terracotta); }
.value h3 { font-size: 28px; margin: 14px 0 10px; }
.value p { color: var(--muted); font-size: 14.5px; margin: 0; }

/* appel à l'action */
.cta { position: relative; overflow: hidden; text-align: center; }
.cta .h1 { max-width: 15ch; margin: 22px auto 22px; color: var(--creme); }
.cta p { max-width: 52ch; margin: 0 auto 40px; color: rgba(232, 216, 195, .85); }
.cta__btns { display: flex; justify-content: center; flex-wrap: wrap; gap: 16px; }
.cta__mono { position: absolute; width: 520px; height: 570px; color: rgba(232, 216, 195, .045); left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; }
.cta .kicker { color: var(--beige); }

/* ---------- pied de page ---------- */
.footer { background: var(--brun); color: rgba(232, 216, 195, .8); padding: clamp(72px, 9vw, 120px) 0 36px; font-size: 14.5px; }
.footer__top { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1.2fr; gap: 48px; padding-bottom: 64px; border-bottom: 1px solid rgba(232, 216, 195, .14); }
.footer .brandf { color: var(--beige); display: inline-flex; flex-direction: column; gap: 14px; }
.footer .brandf svg.mono { width: 56px; height: 62px; }
.footer .brandf svg.word { width: 190px; height: 18px; }
.footer__about { margin-top: 26px; max-width: 34ch; line-height: 1.75; }
.footer h4 { font: 500 11px var(--sans); letter-spacing: .3em; text-transform: uppercase; color: var(--terracotta); margin-bottom: 22px; }
.footer ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.footer a { transition: color .3s; }
.footer a:hover { color: var(--creme); }
.socials { display: flex; gap: 10px; margin-top: 22px; }
.socials a { width: 42px; height: 42px; border: 1px solid rgba(232, 216, 195, .25); border-radius: 50%; display: grid; place-items: center; transition: background .3s, color .3s, border-color .3s; }
.socials a:hover { background: var(--beige); color: var(--brun); border-color: var(--beige); }
.socials svg { width: 17px; height: 17px; fill: currentColor; }
.footer__bottom { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 14px 28px; padding-top: 30px; font-size: 12.5px; letter-spacing: .06em; color: rgba(232, 216, 195, .55); }
.footer__bottom nav { display: flex; flex-wrap: wrap; gap: 8px 24px; }
.pay-icons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.pay-icons span { border: 1px solid rgba(232, 216, 195, .22); padding: 6px 10px; font: 500 10px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: rgba(232, 216, 195, .75); }

/* ---------- bouton WhatsApp flottant ---------- */
.wa-float {
  position: fixed; right: clamp(16px, 2.5vw, 32px); bottom: clamp(16px, 2.5vw, 32px); z-index: 60;
  width: 60px; height: 60px; border-radius: 50%; background: var(--chocolat); color: var(--beige);
  display: grid; place-items: center; box-shadow: 0 14px 34px -12px rgba(43, 33, 28, .55);
  transition: transform .4s var(--ease-out), background .3s;
}
.wa-float:hover { transform: translateY(-4px) scale(1.04); background: var(--terracotta); color: var(--creme); }
.wa-float svg { width: 27px; height: 27px; fill: currentColor; }
.wa-float::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 1px solid var(--terracotta); opacity: 0; animation: ping 3.2s var(--ease) infinite 2s; }
@keyframes ping { 0% { opacity: .7; transform: scale(.9); } 70%, 100% { opacity: 0; transform: scale(1.25); } }
.wa-float .tip {
  position: absolute; right: 74px; white-space: nowrap; background: var(--chocolat); color: var(--creme); padding: 9px 14px;
  font: 400 12.5px var(--sans); letter-spacing: .04em; opacity: 0; transform: translateX(8px); pointer-events: none; transition: opacity .3s, transform .4s var(--ease-out);
}
.wa-float:hover .tip { opacity: 1; transform: none; }

/* ---------- en-têtes de pages ---------- */
.phead { padding: clamp(44px, 6vw, 90px) 0 clamp(36px, 4vw, 60px); }
.phead .h1 { margin-top: 20px; max-width: 18ch; }
.phead p { max-width: 58ch; color: var(--muted); margin-top: 22px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.crumbs a:hover { color: var(--terracotta); }
.crumbs span[aria-hidden] { opacity: .5; }

/* ---------- boutique ---------- */
.tabs { display: flex; gap: 8px 30px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 36px; }
.tabs a, .tabs button { position: relative; padding: 16px 0; font: 400 12px var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); transition: color .3s; }
.tabs a.is-active, .tabs button.is-active { color: var(--chocolat); }
.tabs a.is-active::after, .tabs button.is-active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--chocolat); }
.tabs a:hover { color: var(--chocolat); }
.shop { display: grid; grid-template-columns: 250px 1fr; gap: clamp(32px, 4vw, 64px); align-items: start; }
.filters { position: sticky; top: calc(var(--header-h) + 24px); }
.filters__head { display: none; }
.fgroup { padding: 22px 0; border-bottom: 1px solid var(--line); }
.fgroup:first-child { padding-top: 0; }
.fgroup h4 { font: 500 11px var(--sans); letter-spacing: .26em; text-transform: uppercase; color: var(--chocolat); margin-bottom: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-width: 46px; height: 40px; padding: 0 14px; border: 1px solid var(--line-strong); background: transparent;
  font: 400 12.5px var(--sans); letter-spacing: .06em; color: var(--chocolat); border-radius: var(--radius); transition: all .25s;
}
.chip:hover { border-color: var(--chocolat); }
.chip.is-on { background: var(--chocolat); color: var(--creme); border-color: var(--chocolat); }
.chip:disabled { opacity: .35; text-decoration: line-through; cursor: not-allowed; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.sw {
  position: relative; width: 32px; height: 32px; border-radius: 50%; background: var(--c); border: 1px solid var(--line-strong);
  box-shadow: inset 0 0 0 3px var(--creme); transition: box-shadow .25s, transform .25s;
}
.sw:hover { transform: scale(1.08); }
.sw.is-on { box-shadow: inset 0 0 0 3px var(--creme), 0 0 0 1.5px var(--chocolat); }
.checks { display: grid; gap: 10px; }
.check { display: flex; align-items: center; gap: 12px; font-size: 14px; cursor: pointer; }
.check input { appearance: none; width: 18px; height: 18px; border: 1px solid var(--line-strong); border-radius: 2px; display: grid; place-items: center; margin: 0; transition: background .2s; flex: none; }
.check input:checked { background: var(--chocolat); border-color: var(--chocolat); }
.check input:checked::after { content: ""; width: 5px; height: 9px; border: solid var(--creme); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg) translate(-1px, -1px); }
.check input[type=radio] { border-radius: 50%; }
.check input[type=radio]:checked::after { width: 8px; height: 8px; border: 0; background: var(--creme); border-radius: 50%; transform: none; }
.range { position: relative; height: 28px; }
.range input[type=range] { position: absolute; inset: 0; width: 100%; appearance: none; background: none; pointer-events: none; margin: 0; }
.range input[type=range]::-webkit-slider-thumb { appearance: none; pointer-events: auto; width: 18px; height: 18px; border-radius: 50%; background: var(--creme); border: 1.5px solid var(--chocolat); cursor: grab; }
.range input[type=range]::-moz-range-thumb { pointer-events: auto; width: 16px; height: 16px; border-radius: 50%; background: var(--creme); border: 1.5px solid var(--chocolat); cursor: grab; }
.range__track { position: absolute; left: 0; right: 0; top: 13px; height: 1px; background: var(--line-strong); }
.range__fill { position: absolute; top: 13px; height: 2px; background: var(--chocolat); }
.range__vals { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 8px; }
.shop__bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 28px; font-size: 13.5px; color: var(--muted); }
.select { position: relative; }
.select select { appearance: none; border: 1px solid var(--line-strong); background: transparent; height: 44px; padding: 0 40px 0 16px; font-size: 13px; color: var(--chocolat); border-radius: var(--radius); cursor: pointer; }
.select::after { content: ""; position: absolute; right: 16px; top: 50%; width: 6px; height: 6px; border: solid var(--chocolat); border-width: 0 1px 1px 0; transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.filter-btn { display: none; }
.filters__apply { display: none !important; }
.empty { text-align: center; padding: 80px 20px; color: var(--muted); }
.empty svg.mono { width: 60px; height: 66px; color: var(--beige-d); margin: 0 auto 24px; }
.empty h3 { margin-bottom: 12px; }

/* ---------- fiche produit ---------- */
.product { display: grid; grid-template-columns: 1.15fr .85fr; gap: clamp(32px, 5vw, 88px); align-items: start; padding-top: 24px; padding-bottom: clamp(80px, 9vw, 130px); }
.gallery { display: grid; grid-template-columns: 86px 1fr; gap: 16px; position: sticky; top: calc(var(--header-h) + 20px); }
.gallery__thumbs { display: flex; flex-direction: column; gap: 12px; }
.gallery__thumbs button { aspect-ratio: 3 / 4; background: var(--beige); overflow: hidden; opacity: .55; transition: opacity .3s; border: 1px solid transparent; }
.gallery__thumbs button.is-on { opacity: 1; border-color: var(--chocolat); }
.gallery__thumbs img { width: 100%; height: 100%; object-fit: cover; }
.gallery__main { position: relative; aspect-ratio: 3 / 4; background: var(--beige); overflow: hidden; cursor: zoom-in; }
.gallery__main img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .6s var(--ease), transform .3s var(--ease); }
.gallery__main.zooming img.cur { transform: scale(1.9); }
.gallery__dots { display: none; }
.gallery__count { position: absolute; left: 18px; bottom: 16px; z-index: 2; font: 400 12px var(--sans); letter-spacing: .18em; color: var(--chocolat); background: rgba(247, 242, 234, .9); padding: 6px 10px; }
.pinfo .crumbs { margin-bottom: 26px; }
.pinfo h1 { font-size: clamp(38px, 4vw, 58px); font-weight: 300; }
.pinfo .price { font: 400 22px var(--sans); color: var(--chocolat); margin: 18px 0 8px; letter-spacing: .02em; }
.pinfo .price small { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.avail { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; letter-spacing: .06em; color: var(--muted); }
.avail i { width: 8px; height: 8px; border-radius: 50%; background: #6F8A5A; }
.avail.sur_commande i { background: var(--terracotta); }
.avail.epuise i { background: #999; }
.pinfo .short { font: italic 300 21px/1.5 var(--serif); color: var(--chocolat); margin: 26px 0; padding-top: 26px; border-top: 1px solid var(--line); }
.opt { margin-top: 28px; }
.opt__head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
.opt__head span { font: 500 11px var(--sans); letter-spacing: .24em; text-transform: uppercase; color: var(--chocolat); }
.opt__head em { font-style: normal; color: var(--muted); font-size: 13.5px; letter-spacing: .02em; text-transform: none; margin-left: 8px; font-weight: 300; }
.opt__head button { font-size: 12.5px; text-decoration: underline; text-underline-offset: 4px; color: var(--muted); }
.opt__head button:hover { color: var(--terracotta); }
.buy { display: grid; grid-template-columns: 120px 1fr; gap: 12px; margin-top: 34px; }
.qty { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--line-strong); height: 54px; border-radius: var(--radius); }
.qty button { width: 40px; height: 100%; font-size: 18px; color: var(--chocolat); }
.qty input { width: 34px; border: 0; background: none; text-align: center; font-size: 15px; -moz-appearance: textfield; }
.qty input::-webkit-inner-spin-button { appearance: none; }
.buy .btn--wa { grid-column: 1 / -1; }
.btn--wa svg { width: 18px; height: 18px; fill: currentColor; }
.reassure { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 28px; }
.reassure div { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 16px 8px; background: var(--white); font-size: 12px; line-height: 1.4; color: var(--muted); }
.reassure svg { width: 22px; height: 22px; stroke: var(--terracotta); fill: none; stroke-width: 1.2; }
.acc { margin-top: 40px; border-top: 1px solid var(--line); }
.acc details { border-bottom: 1px solid var(--line); }
.acc summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 22px 0; font: 500 11.5px var(--sans); letter-spacing: .24em; text-transform: uppercase; color: var(--chocolat); }
.acc summary::-webkit-details-marker { display: none; }
.acc summary i { position: relative; width: 12px; height: 12px; }
.acc summary i::before, .acc summary i::after { content: ""; position: absolute; left: 0; top: 50%; width: 12px; height: 1px; background: currentColor; transition: transform .4s var(--ease); }
.acc summary i::after { transform: rotate(90deg); }
.acc details[open] summary i::after { transform: rotate(0); }
.acc .acc__body { padding: 0 0 24px; color: var(--muted); font-size: 15px; }
.acc ul { margin: 0; padding-left: 18px; }
.acc li { margin-bottom: 6px; }

/* modale, visionneuse */
.modal { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 20px; visibility: hidden; }
.modal.open { visibility: visible; }
.modal__bg { position: absolute; inset: 0; background: rgba(43, 33, 28, .55); opacity: 0; transition: opacity .4s; }
.modal.open .modal__bg { opacity: 1; }
.modal__box { position: relative; width: min(760px, 100%); max-height: calc(100vh - 40px); overflow: auto; background: var(--creme); padding: clamp(28px, 4vw, 52px); opacity: 0; transform: translateY(24px); transition: opacity .4s, transform .6s var(--ease-out); }
.modal.open .modal__box { opacity: 1; transform: none; }
.modal__close { position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; display: grid; place-items: center; }
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th, .table td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--line); }
.table th { font: 500 10.5px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--chocolat); }
.lightbox { position: fixed; inset: 0; z-index: 95; background: var(--brun); display: none; align-items: center; justify-content: center; }
.lightbox.open { display: flex; animation: pageIn .5s var(--ease-out); }
.lightbox img { max-width: 92vw; max-height: 88vh; object-fit: contain; }
.lightbox button { position: absolute; color: var(--beige); width: 56px; height: 56px; display: grid; place-items: center; }
.lightbox .lb-close { top: 16px; right: 16px; }
.lightbox .lb-prev { left: 10px; top: 50%; transform: translateY(-50%); }
.lightbox .lb-next { right: 10px; top: 50%; transform: translateY(-50%); }
.lightbox .lb-prev svg, .lightbox .lb-next svg { width: 28px; height: 16px; }

/* ---------- panier (tiroir) ---------- */
.drawer { position: fixed; inset: 0; z-index: 85; visibility: hidden; }
.drawer.open { visibility: visible; }
.drawer__bg { position: absolute; inset: 0; background: rgba(43, 33, 28, .45); opacity: 0; transition: opacity .45s; }
.drawer.open .drawer__bg { opacity: 1; }
.drawer__panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--creme); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .7s var(--ease-out); }
.drawer.open .drawer__panel { transform: none; }
.drawer__head { display: flex; justify-content: space-between; align-items: center; padding: 24px 28px; border-bottom: 1px solid var(--line); }
.drawer__head h3 { font-size: 28px; }
.drawer__body { flex: 1; overflow: auto; padding: 8px 28px; }
.drawer__foot { padding: 24px 28px 28px; border-top: 1px solid var(--line); background: var(--white); }
.line { display: grid; grid-template-columns: 84px 1fr auto; gap: 16px; padding: 20px 0; border-bottom: 1px solid var(--line); }
.line__img { aspect-ratio: 3 / 4; background: var(--beige); overflow: hidden; }
.line__img img { width: 100%; height: 100%; object-fit: cover; }
.line__name { font: 400 19px/1.2 var(--serif); color: var(--chocolat); }
.line__meta { font-size: 12.5px; color: var(--muted); margin: 4px 0 10px; letter-spacing: .02em; }
.line .qty { height: 38px; width: 104px; }
.line .qty button { width: 32px; }
.line__right { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; font-size: 14px; }
.line__rm { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); text-decoration: underline; text-underline-offset: 4px; }
.line__rm:hover { color: var(--terracotta); }
.totals { display: grid; gap: 10px; font-size: 14.5px; }
.totals div { display: flex; justify-content: space-between; }
.totals .grand { font: 400 18px var(--sans); color: var(--chocolat); padding-top: 12px; border-top: 1px solid var(--line); margin-top: 4px; }

/* ---------- formulaires ---------- */
.form { display: grid; gap: 20px; }
.form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.form .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.field { display: grid; gap: 8px; }
.field > span, .field > label { font: 500 10.5px var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--chocolat); }
.field > span em { font-style: normal; color: var(--terracotta); }
.field input, .field select, .field textarea {
  width: 100%; border: 0; border-bottom: 1px solid var(--line-strong); background: transparent; padding: 12px 0; font-size: 15.5px; color: var(--ink);
  border-radius: 0; transition: border-color .3s; appearance: none;
}
.field textarea { min-height: 120px; resize: vertical; border: 1px solid var(--line-strong); padding: 14px; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--terracotta); }
.field small { color: var(--muted); font-size: 12.5px; }
.field.has-err input, .field.has-err textarea, .field.has-err select { border-color: #A83B2B; }
.field .err { color: #A83B2B; font-size: 12.5px; }
.form-note { font-size: 13px; color: var(--muted); }
.box { background: var(--white); padding: clamp(24px, 3vw, 40px); }
.box + .box { margin-top: 20px; }
.box h3 { font-size: 26px; margin-bottom: 22px; display: flex; align-items: baseline; gap: 14px; }
.box h3 b { font: 500 11px var(--sans); letter-spacing: .2em; color: var(--terracotta); }
.opts { display: grid; gap: 10px; }
.optcard { display: grid; grid-template-columns: 22px 1fr auto; gap: 14px; align-items: center; padding: 18px; border: 1px solid var(--line-strong); cursor: pointer; transition: border-color .3s, background .3s; }
.optcard:hover { border-color: var(--chocolat); }
.optcard input { margin: 0; accent-color: var(--chocolat); width: 18px; height: 18px; }
.optcard.is-on { border-color: var(--chocolat); background: rgba(232, 216, 195, .35); }
.optcard b { font-weight: 500; color: var(--chocolat); display: block; font-size: 14.5px; }
.optcard small { color: var(--muted); font-size: 12.5px; }
.optcard .fee { font-size: 14px; color: var(--chocolat); white-space: nowrap; }
.paylogos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.paylogos span { font: 500 9.5px var(--sans); letter-spacing: .12em; text-transform: uppercase; padding: 4px 7px; border: 1px solid var(--line-strong); color: var(--chocolat); }

/* commande */
.checkout { display: grid; grid-template-columns: 1.25fr .75fr; gap: clamp(24px, 4vw, 56px); align-items: start; padding-bottom: clamp(80px, 9vw, 130px); }
.summary { position: sticky; top: calc(var(--header-h) + 20px); background: var(--white); padding: clamp(24px, 3vw, 36px); }
.summary h3 { font-size: 26px; margin-bottom: 8px; }
.summary .line { grid-template-columns: 64px 1fr auto; padding: 16px 0; }
.summary .line__name { font-size: 17px; }
.secure { display: flex; gap: 10px; align-items: flex-start; font-size: 12.5px; color: var(--muted); margin-top: 18px; }
.secure svg { width: 18px; height: 18px; flex: none; stroke: var(--terracotta); fill: none; stroke-width: 1.3; margin-top: 2px; }
.notice { padding: 16px 18px; background: rgba(185, 105, 75, .1); border-left: 2px solid var(--terracotta); font-size: 13.5px; color: var(--chocolat); }

/* confirmation */
.confirm { max-width: 720px; margin: 0 auto; text-align: center; padding: clamp(60px, 8vw, 120px) 0; }
.confirm .seal { width: 110px; height: 110px; border-radius: 50%; background: var(--terracotta); color: var(--creme); display: grid; place-items: center; margin: 0 auto 30px; }
.confirm .seal svg { width: 40px; height: 44px; }
.confirm .seal.fail { background: var(--chocolat); }
.confirm .h1 { margin-bottom: 18px; }
.confirm .box { text-align: left; margin-top: 40px; }

/* ---------- sur-mesure ---------- */
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; border-top: 1px solid var(--line); }
.step { padding: 32px 22px 0 0; }
.step b { font: 200 42px/1 var(--sans); color: var(--terracotta); }
.step h3 { font-size: 23px; margin: 16px 0 8px; }
.step p { font-size: 14px; color: var(--muted); margin: 0; }
.wizard { display: grid; grid-template-columns: 300px 1fr; gap: clamp(28px, 5vw, 80px); align-items: start; }
.wizard__nav { position: sticky; top: calc(var(--header-h) + 24px); display: grid; gap: 4px; counter-reset: s; }
.wizard__nav button { display: flex; align-items: center; gap: 16px; padding: 14px 0; text-align: left; color: var(--muted); font-size: 14.5px; border-bottom: 1px solid var(--line); transition: color .3s; }
.wizard__nav button::before { counter-increment: s; content: "0" counter(s); font: 200 20px var(--sans); color: rgba(124, 104, 93, .55); width: 30px; transition: color .3s; }
.wizard__nav button.is-on { color: var(--chocolat); }
.wizard__nav button.is-on::before, .wizard__nav button.is-done::before { color: var(--terracotta); }
.wizard__pane { display: none; }
.wizard__pane.is-on { display: block; animation: pageIn .6s var(--ease-out); }
.wizard__pane h3 { font-size: 34px; font-weight: 300; margin-bottom: 8px; }
.wizard__pane > p { color: var(--muted); margin-bottom: 30px; }
.wizard__actions { display: flex; justify-content: space-between; gap: 14px; margin-top: 40px; padding-top: 28px; border-top: 1px solid var(--line); }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.card-opt { position: relative; display: block; cursor: pointer; border: 1px solid var(--line-strong); background: var(--white); transition: border-color .3s; }
.card-opt input { position: absolute; opacity: 0; }
.card-opt .ph { aspect-ratio: 4 / 5; }
.card-opt .t { padding: 14px 16px; font: 400 18px/1.2 var(--serif); color: var(--chocolat); }
.card-opt .t small { display: block; font: 300 12.5px var(--sans); color: var(--muted); margin-top: 4px; }
.card-opt:has(input:checked) { border-color: var(--chocolat); box-shadow: 0 0 0 1px var(--chocolat); }
.card-opt:has(input:checked)::after { content: "✓"; position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border-radius: 50%; background: var(--chocolat); color: var(--creme); display: grid; place-items: center; font-size: 13px; }
.fabric { height: 92px; background: var(--c, var(--beige)); position: relative; overflow: hidden; }
.fabric::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(45deg, rgba(255, 255, 255, .06) 0 2px, transparent 2px 6px); }
.drop { border: 1px dashed var(--line-strong); padding: 30px; text-align: center; background: var(--white); cursor: pointer; transition: border-color .3s, background .3s; }
.drop:hover, .drop.over { border-color: var(--terracotta); background: rgba(232, 216, 195, .3); }
.drop svg { width: 30px; height: 30px; stroke: var(--terracotta); fill: none; stroke-width: 1.2; margin: 0 auto 10px; }
.drop img { max-height: 220px; margin: 0 auto 12px; }
.measure-help { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; font-size: 13px; color: var(--muted); background: var(--white); padding: 18px 20px; margin-bottom: 24px; }
.measure-help b { color: var(--chocolat); font-weight: 500; }

/* ---------- à propos ---------- */
.about-hero { display: grid; grid-template-columns: .9fr 1.1fr; gap: clamp(32px, 6vw, 100px); align-items: center; }
.about-hero .ph { aspect-ratio: 4 / 5; }
.about-hero .sig { font: italic 300 30px var(--serif); color: var(--terracotta); margin-top: 26px; }
.prose { max-width: 62ch; }
.prose p { color: var(--ink); }
.prose h2 { font-size: 32px; margin: 48px 0 14px; }
.prose h3 { font-size: 23px; margin: 30px 0 10px; }
.prose ul { padding-left: 20px; }
.prose li { margin-bottom: 8px; }
.pillars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.pillar { background: var(--creme); padding: 34px 26px; }
.pillar svg { width: 30px; height: 30px; stroke: var(--terracotta); fill: none; stroke-width: 1.1; }
.pillar h3 { font-size: 23px; margin: 22px 0 10px; }
.pillar p { font-size: 14px; color: var(--muted); margin: 0; }
.quote { text-align: center; max-width: 900px; margin: 0 auto; }
.quote blockquote { margin: 0; font: italic 300 clamp(28px, 3.4vw, 48px)/1.3 var(--serif); color: var(--creme); }
.quote cite { display: block; margin-top: 26px; font: 500 11px var(--sans); letter-spacing: .3em; text-transform: uppercase; font-style: normal; color: var(--terracotta); }
.mosaic { display: grid; grid-template-columns: 1.2fr .8fr 1fr; grid-template-rows: auto auto; gap: 16px; }
.mosaic .ph:nth-child(1) { grid-row: span 2; aspect-ratio: auto; height: 100%; }
.mosaic .ph:nth-child(2) { aspect-ratio: 4 / 5; }
.mosaic .ph:nth-child(3) { aspect-ratio: 4 / 5; }
.mosaic .ph:nth-child(4) { grid-column: span 2; aspect-ratio: 16 / 8; }

/* ---------- contact ---------- */
.contact { display: grid; grid-template-columns: .8fr 1.2fr; gap: clamp(32px, 6vw, 100px); align-items: start; }
.cinfo { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.cinfo > a, .cinfo > div { display: grid; grid-template-columns: 44px 1fr; gap: 16px; align-items: center; padding: 22px 24px; background: var(--creme); transition: background .3s; }
.cinfo > a:hover { background: var(--white); }
.cinfo svg { width: 22px; height: 22px; stroke: var(--terracotta); fill: none; stroke-width: 1.2; }
.cinfo svg.fill { fill: var(--terracotta); stroke: none; }
.cinfo small { display: block; font: 500 10.5px var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.cinfo b { font-weight: 400; color: var(--chocolat); font-size: 16px; }
.contact .socials a { border-color: var(--line-strong); color: var(--chocolat); }
.contact .socials a:hover { background: var(--chocolat); color: var(--creme); border-color: var(--chocolat); }

/* ---------- compte ---------- */
.auth { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(24px, 4vw, 56px); padding-bottom: clamp(80px, 9vw, 130px); }
.account { display: grid; grid-template-columns: 260px 1fr; gap: clamp(28px, 5vw, 72px); padding-bottom: clamp(80px, 9vw, 130px); align-items: start; }
.account__nav { display: grid; gap: 2px; position: sticky; top: calc(var(--header-h) + 24px); }
.account__nav button { text-align: left; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; color: var(--muted); }
.account__nav button.is-on { color: var(--chocolat); }
.account__nav button.is-on::before { content: "— "; color: var(--terracotta); }
.order { border: 1px solid var(--line); background: var(--white); margin-bottom: 16px; }
.order summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1.2fr 1fr 1fr auto; gap: 16px; align-items: center; padding: 20px 24px; font-size: 14px; }
.order summary::-webkit-details-marker { display: none; }
.order__body { padding: 0 24px 24px; }
.pill { display: inline-block; padding: 5px 10px; font: 500 10px/1.3 var(--sans); letter-spacing: .14em; text-transform: uppercase; border-radius: 20px; background: var(--beige); color: var(--chocolat); }
.pill--ok { background: #E3E8D8; color: #445533; }
.pill--wait { background: #F3E3D2; color: #8A5A2B; }
.pill--bad { background: #EBD5D0; color: #7A2E22; }
.pill--dark { background: var(--chocolat); color: var(--creme); }

/* toasts */
.toasts { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 120; display: grid; gap: 10px; width: min(440px, calc(100% - 32px)); }
.toast { background: var(--chocolat); color: var(--creme); padding: 15px 20px; font-size: 14px; opacity: 0; transform: translateY(14px); transition: opacity .35s, transform .5s var(--ease-out); box-shadow: 0 20px 40px -20px rgba(0, 0, 0, .4); }
.toast.in { opacity: 1; transform: none; }
.toast--error { background: #7A2E22; }
.toast--success { background: var(--brun); border-left: 3px solid var(--terracotta); }

/* chargement */
.loading { display: grid; place-items: center; min-height: 50vh; }
.loading svg.mono { width: 54px; height: 60px; color: var(--beige-d); animation: breathe 1.6s var(--ease) infinite; }
@keyframes breathe { 50% { opacity: .35; transform: scale(.94); } }
.skel { background: linear-gradient(90deg, var(--beige) 0, #efe4d4 50%, var(--beige) 100%); background-size: 200% 100%; animation: sk 1.4s linear infinite; }
@keyframes sk { to { background-position: -200% 0; } }
.demo-flag { position: fixed; left: 16px; bottom: 16px; z-index: 55; background: var(--white); border: 1px solid var(--line-strong); padding: 8px 12px; font-size: 11.5px; letter-spacing: .08em; color: var(--muted); }
.demo-flag b { color: var(--terracotta); font-weight: 500; }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .grid-products { grid-template-columns: repeat(3, 1fr); }
  .rail { grid-auto-columns: calc((100% - 2 * 24px) / 3); gap: 24px; }
  .footer__top { grid-template-columns: 1fr 1fr; }
  .pillars { grid-template-columns: repeat(3, 1fr); }
  .steps { grid-template-columns: repeat(3, 1fr); row-gap: 20px; }
}
@media (max-width: 960px) {
  :root { --header-h: 68px; }
  .nav { display: none; }
  .burger { display: grid; }
  .header__in { grid-template-columns: auto 1fr auto; }
  .brand { justify-self: start; order: 0; }
  .brand svg.word { width: 128px; }
  .brand svg.mono { width: 32px; height: 36px; }
  .tools { order: 2; }
  .burger { order: -1; }
  .hero__grid, .feature, .feature--rev, .craft, .about-hero, .contact, .product, .checkout, .wizard, .account, .auth { grid-template-columns: 1fr; }
  .feature--rev .feature__media { order: 0; }
  .hero__media { max-width: 560px; }
  .hero__badge { left: auto; right: 16px; bottom: -40px; width: 120px; height: 120px; }
  .hero__water, .hero__caption { display: none; }
  .colls { grid-template-columns: 1fr 1fr; }
  .coll:first-child { grid-column: 1 / -1; }
  .coll:first-child .ph { aspect-ratio: 16 / 11; }
  .values { grid-template-columns: 1fr 1fr; }
  .value:nth-child(2) { border-right: 0; }
  .value:nth-child(3) { padding-left: 0; }
  .value { padding-bottom: 32px; border-bottom: 1px solid var(--line); }
  .craft__media .ph + .ph { right: 0; }
  .shop { grid-template-columns: 1fr; }
  .filter-btn { display: inline-flex; }
  .filters { position: fixed; inset: 0 0 0 auto; width: min(380px, 92%); z-index: 86; background: var(--creme); padding: 24px; overflow: auto; transform: translateX(100%); transition: transform .6s var(--ease-out); top: 0; }
  .filters.open { transform: none; box-shadow: -30px 0 60px -30px rgba(0, 0, 0, .4); }
  .filters__head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .filters__apply { display: inline-flex !important; }
  .gallery { position: relative; top: 0; grid-template-columns: 1fr; }
  .gallery__thumbs { flex-direction: row; order: 2; }
  .gallery__thumbs button { width: 64px; }
  .summary, .wizard__nav, .account__nav { position: static; }
  .wizard__nav { grid-template-columns: repeat(5, 1fr); }
  .wizard__nav button { flex-direction: column; gap: 4px; font-size: 11px; text-align: center; border-bottom-width: 2px; }
  .wizard__nav button.is-on { border-bottom-color: var(--terracotta); }
  .wizard__nav button span { display: none; }
  .mosaic { grid-template-columns: 1fr 1fr; }
  .mosaic .ph:nth-child(1) { grid-row: auto; grid-column: span 2; aspect-ratio: 16 / 10; }
  .demo-flag { display: none; }
}
@media (max-width: 640px) {
  body { font-size: 15.5px; }
  .announce { font-size: 10px; letter-spacing: .12em; }
  .grid-products, .grid-products--3 { grid-template-columns: 1fr 1fr; gap: 28px 14px; }
  .rail { grid-auto-columns: 72%; gap: 14px; }
  .pcard__body { flex-direction: column; gap: 4px; }
  .pcard__name { font-size: 18px; }
  .pcard__quick { display: none; }
  .feature__mini { grid-template-columns: 1fr 1fr; }
  .colls { grid-template-columns: 1fr; }
  .values { grid-template-columns: 1fr; }
  .value, .value + .value { padding-left: 0; border-right: 0; }
  .footer__top { grid-template-columns: 1fr; gap: 40px; }
  .form .row, .form .row3, .measure-help { grid-template-columns: 1fr; }
  .cards { grid-template-columns: 1fr 1fr; }
  .pillars { grid-template-columns: 1fr; }
  .steps { grid-template-columns: 1fr 1fr; }
  .reassure { grid-template-columns: 1fr; }
  .reassure div { flex-direction: row; text-align: left; }
  .order summary { grid-template-columns: 1fr auto; }
  .order summary .hide-sm { display: none; }
  .section-head { align-items: flex-start; }
  .hero__ctas .btn { width: 100%; }
  .btn { letter-spacing: .18em; padding: 0 20px; }
  .wa-float { width: 54px; height: 54px; }
  .line { grid-template-columns: 70px 1fr; }
  .line__right { grid-column: 2; flex-direction: row; align-items: center; justify-content: space-between; }
}

/* =====================================================================
   ADMIRELLE B — DESIGN V4 « ÉPURÉ ET LUMINEUX »
   Fond blanc, grandes photos en grille, typographie sobre.
   Polices de la charte uniquement : Cormorant Garamond (titres) et Jost (textes).
   Couleurs de la marque : chocolat et brun pour le texte, crème pour les surfaces,
   terracotta en touches discrètes.
   ===================================================================== */
:root {
  --paper: #FFFFFF;
  --line: rgba(43, 33, 28, .1);
  --line-strong: rgba(43, 33, 28, .22);
  --muted: #73625A;
  --header-h: 72px;
  --terra-ink: #9E5539;
}

/* ---------- base ---------- */
body { background: var(--paper); color: var(--brun); font-size: 15px; line-height: 1.7; }
h1, h2, h3, h4 { color: var(--brun); letter-spacing: 0; }
.display { font-size: clamp(38px, 4vw, 58px); line-height: 1.06; }
.h1 { font-size: clamp(32px, 3.2vw, 46px); line-height: 1.1; font-weight: 300; }
.h2 { font-size: clamp(28px, 2.6vw, 38px); line-height: 1.12; font-weight: 300; }
.h3 { font-size: clamp(20px, 1.6vw, 24px); }
.display em, .h1 em, .h2 em { font-style: italic; color: inherit; }
.kicker { font-size: 11px; letter-spacing: .22em; color: var(--muted); gap: 0; }
.kicker::before { display: none; }
.kicker--light { color: var(--beige); }
.lead { font-size: clamp(19px, 1.5vw, 22px); }
.section { padding: clamp(56px, 7vw, 104px) 0; }
.section--beige { background: var(--creme); }
.section--dark { background: var(--paper); color: var(--ink); }
.section--choco { background: var(--creme); color: var(--ink); }
.section--dark .btn--ghost, .section--choco .btn--ghost { --fg: var(--brun); border-color: var(--brun); }
.section--dark .btn--ghost::after, .section--choco .btn--ghost::after { background: var(--brun); }
.section--dark .btn--ghost:hover, .section--choco .btn--ghost:hover { color: var(--paper); }
.section--dark .link, .section--choco .link { color: var(--brun); }
.section--dark h2, .section--dark h3, .section--choco h2, .section--choco h3 { color: var(--brun); }
.section--dark .kicker, .section--choco .kicker { color: var(--muted); }
.section-head { margin-bottom: clamp(28px, 3vw, 44px); }
.section-head .h2 { margin-top: 12px; }
.ph { background: var(--creme); }
.ph::after { display: none; }

/* boutons : rectangles nets, sans effet appuyé */
.btn { min-height: 48px; padding: 0 26px; font-size: 11px; letter-spacing: .18em; --bg: var(--brun); }
.btn::after { background: var(--chocolat); }
.btn--ghost { --bg: transparent; --fg: var(--brun); border-color: var(--brun); }
.btn--ghost::after { background: var(--brun); }
.btn--ghost:hover { color: var(--paper); }
.btn--terra { --bg: var(--brun); }
.btn--light { --bg: var(--paper); --fg: var(--brun); }
.btn--light::after { background: var(--creme); }
.btn .wa-ic { width: 16px; height: 16px; fill: currentColor; }
.link { color: var(--brun); }

/* lien souligné discret */
.link4 { display: inline-block; font: 400 12px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--brun); padding-bottom: 3px; border-bottom: 1px solid currentColor; transition: color .2s, border-color .2s; }
.link4:hover { color: var(--terra-ink); }
.kick4 { margin: 0; font: 500 11px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.t4 { margin: 0; font: 300 clamp(26px, 2.2vw, 32px)/1.15 var(--serif); color: var(--brun); }
.t4--lg { font-size: clamp(30px, 2.8vw, 42px); }
.btns4 { display: flex; flex-wrap: wrap; gap: 12px; }

/* ---------- bandeau et en-tête ---------- */
.announce { background: var(--brun); color: var(--creme); font-size: 10.5px; letter-spacing: .2em; padding: 9px var(--gut); }
.header { background: rgba(255, 255, 255, .97); border-bottom: 1px solid var(--line); }
.header.is-scrolled { --header-h: 64px; border-bottom-color: var(--line); }
.header__in { max-width: none; padding: 0 clamp(20px, 3vw, 44px); grid-template-columns: auto 1fr auto; gap: clamp(16px, 3vw, 48px); }
.brand { justify-self: start; gap: 10px; color: var(--brun); }
.brand svg.mono, .header.is-scrolled .brand svg.mono { width: 30px; height: 33px; }
.brand svg.word { width: 140px; height: 13px; }
.nav--main { justify-self: center; display: flex; gap: clamp(18px, 2.4vw, 38px); }
.nav a { font: 400 11.5px var(--sans); letter-spacing: .16em; color: var(--brun); }
.nav a.is-active { color: var(--brun); }
.nav a::after { background: var(--brun); }
.tool { color: var(--brun); }
.tool .badge { background: var(--brun); color: var(--paper); }

/* menu mobile clair */
.mmenu { background: var(--paper); color: var(--brun); }
.mmenu__top svg.mono { color: var(--brun); }
.mmenu .tool { color: var(--brun); }
.mmenu nav a { color: var(--brun); font-size: clamp(28px, 8vw, 40px); font-weight: 300; }
.mmenu nav a:hover, .mmenu nav a.is-active { color: var(--terra-ink); }
.mmenu__foot { color: var(--muted); }

/* ---------- accueil : deux grandes photos ---------- */
.hero4 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.hero4__tile { position: relative; display: block; color: var(--paper); overflow: hidden; }
.hero4__tile .ph { aspect-ratio: auto; height: clamp(520px, calc(100svh - var(--header-h) - 34px), 900px); }
.hero4__tile .ph img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; transition: transform 1.6s var(--ease-out); }
.hero4__tile:hover .ph img { transform: scale(1.03); }
.hero4__tile::after { content: ""; position: absolute; inset: 45% 0 0 0; background: linear-gradient(180deg, rgba(43, 33, 28, 0), rgba(43, 33, 28, .62)); pointer-events: none; }
.hero4__txt { position: absolute; left: clamp(20px, 3vw, 44px); right: clamp(20px, 3vw, 44px); bottom: clamp(24px, 3.4vw, 48px); z-index: 2; display: grid; justify-items: start; gap: 12px; }
.hero4__kick { font: 500 11px var(--sans); letter-spacing: .22em; text-transform: uppercase; }
.hero4__title { margin: 0; color: var(--paper); font: 300 clamp(34px, 3.4vw, 52px)/1.08 var(--serif); max-width: 14ch; }
.hero4__title em { font-style: italic; }
.hero4__title .ap { margin: 0 .07em 0 -.02em; }
.hero4__title--sm { font-size: clamp(28px, 2.6vw, 40px); }
.hero4__cta { margin-top: 6px; font: 400 12px var(--sans); letter-spacing: .16em; text-transform: uppercase; padding-bottom: 3px; border-bottom: 1px solid currentColor; }

/* introduction */
.intro4 { padding: clamp(64px, 8vw, 120px) 0 clamp(24px, 3vw, 40px); text-align: center; }
.intro4__text { max-width: 34ch; margin: 18px auto 26px; font: 300 clamp(22px, 2vw, 28px)/1.45 var(--serif); color: var(--brun); }
.intro4__links { display: flex; justify-content: center; gap: 28px; }

/* sections */
.sec4 { padding: clamp(44px, 5.5vw, 80px) 0; }
.head4 { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 14px 28px; margin-bottom: clamp(22px, 2.6vw, 34px); }
.head4__more { margin-left: auto; }

/* catégories */
.cats4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(10px, 1.2vw, 16px); }
.cat4 { display: block; }
.cat4 .ph { aspect-ratio: 3 / 4; }
.cat4 .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .6s var(--ease), transform 1.2s var(--ease-out); }
.cat4 .ph img.alt { opacity: 0; }
.cat4:hover .ph img.alt { opacity: 1; }
.cat4__name { display: block; margin-top: 12px; font: 400 12.5px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--brun); }
.cat4__n { display: block; font-size: 13px; color: var(--muted); }

/* onglets texte */
.tabs4 { display: flex; flex-wrap: wrap; gap: 4px 22px; }
.tabs4 button { min-height: 44px; font: 400 12px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); position: relative; transition: color .2s; }
.tabs4 button::after { content: ""; position: absolute; left: 0; right: 0; bottom: 10px; height: 1px; background: var(--brun); transform: scaleX(0); transition: transform .3s var(--ease-out); }
.tabs4 button:hover, .tabs4 button.is-on { color: var(--brun); }
.tabs4 button.is-on::after { transform: scaleX(1); }

/* grille de créations */
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(28px, 3vw, 44px) clamp(10px, 1.2vw, 16px); transition: opacity .2s var(--ease); }
.grid4.swap { opacity: 0; }
.grid-products { gap: clamp(28px, 3vw, 44px) clamp(10px, 1.2vw, 16px); }

/* cartes produit : sobres, texte en Jost */
.pcard__wrap { position: relative; overflow: hidden; }
.pcard__media { aspect-ratio: 3 / 4; background: var(--creme); }
.pcard__media img { transition: opacity .5s var(--ease); }
.pcard:hover .pcard__media img { transform: none; }
.pcard__tag { top: 10px; left: 10px; background: var(--paper); color: var(--brun); font: 500 9.5px var(--sans); letter-spacing: .16em; padding: 6px 8px; }
.pcard__tag--terra { color: var(--terra-ink); background: var(--paper); }
.pcard__add {
  position: absolute; right: 10px; bottom: 10px; z-index: 3; width: 40px; height: 40px; border-radius: 0;
  display: grid; place-items: center; background: var(--paper); color: var(--brun);
  opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .3s var(--ease-out), background .2s, color .2s;
}
.pcard__add span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pcard__add .icon { width: 18px; height: 18px; }
.pcard:hover .pcard__add, .pcard__add:focus-visible { opacity: 1; transform: none; }
.pcard__add:hover { background: var(--brun); color: var(--paper); }
@media (hover: none) { .pcard__add { opacity: 1; transform: none; width: 44px; height: 44px; right: 6px; bottom: 6px; background: rgba(255, 255, 255, .92); } }
.pcard__body { padding-top: 12px; display: grid; gap: 2px; }
.pcard__name { font: 400 13.5px/1.4 var(--sans); letter-spacing: .02em; color: var(--brun); }
.pcard__name:hover { color: var(--terra-ink); }
.pcard__price { font: 300 13.5px var(--sans); color: var(--brun); }
.pcard__price small { color: var(--muted); }
.pcard__meta { margin-top: 8px; }
.pcard__cat { display: none; }
.swatches-mini { margin: 0; }

/* pièce signature */
.star4__in { display: grid; grid-template-columns: 1.15fr .85fr; gap: clamp(24px, 5vw, 96px); align-items: center; }
.star4__big { display: block; aspect-ratio: 4 / 5; }
.star4__big img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }
.star4__txt { display: grid; justify-items: start; gap: 16px; }
.star4__short { margin: 0; color: var(--muted); max-width: 40ch; }
.star4__price { margin: 0; font-size: 15px; }
.star4__small { display: block; width: min(240px, 60%); aspect-ratio: 3 / 4; margin-top: 18px; }
.star4__small img { width: 100%; height: 100%; object-fit: cover; }

/* collections */
.colls4 { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(10px, 1.2vw, 16px); }
.coll4 { display: block; }
.coll4 .ph { aspect-ratio: 4 / 5; }
.coll4 .ph img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s var(--ease-out); }
.coll4:hover .ph img { transform: scale(1.03); }
.coll4 h3 { margin: 16px 0 6px; font: 300 26px/1.2 var(--serif); }
.coll4 p { margin: 0 0 14px; font-size: 14px; color: var(--muted); max-width: 40ch; }

/* sur-mesure */
.bes4 { background: var(--creme); padding: clamp(56px, 7vw, 100px) 0; }
.bes4__in { display: grid; grid-template-columns: .9fr 1.1fr; gap: clamp(24px, 6vw, 110px); align-items: center; }
.bes4__media { aspect-ratio: 4 / 5; }
.bes4__media img { width: 100%; height: 100%; object-fit: cover; }
.bes4__txt { display: grid; justify-items: start; gap: 18px; max-width: 520px; }
.bes4__txt > p:not(.kick4) { margin: 0; color: var(--muted); }
.steps4 { list-style: none; margin: 6px 0 10px; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 100%; border-top: 1px solid var(--line-strong); }
.steps4 li { padding-top: 14px; font-size: 13.5px; color: var(--brun); }
.steps4 b { display: block; font: 300 13px var(--sans); color: var(--muted); letter-spacing: .1em; margin-bottom: 2px; }

/* garanties */
.serv4 { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.serv4__in { display: grid; grid-template-columns: repeat(4, 1fr); }
.serv4__item { display: flex; gap: 14px; align-items: flex-start; padding: 28px 20px; }
.serv4__item + .serv4__item { border-left: 1px solid var(--line); }
.serv4__item svg { width: 22px; height: 22px; flex: none; stroke: var(--brun); fill: none; stroke-width: 1.2; margin-top: 2px; }
.serv4__item svg.fill { fill: var(--brun); stroke: none; }
.serv4__item b { display: block; font: 500 12px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--brun); }
.serv4__item span { font-size: 13.5px; color: var(--muted); }

/* ---------- aperçu rapide ---------- */
.modal__box { background: var(--paper); }
.modal--qv .modal__box { width: min(960px, 100%); padding: 0; }
.modal--qv .modal__close { z-index: 3; background: var(--paper); top: 10px; right: 10px; }
.qv { display: grid; grid-template-columns: 1fr 1fr; }
.qv__media { position: relative; background: var(--creme); }
.qv__main { position: relative; aspect-ratio: 3 / 4; overflow: hidden; cursor: pointer; }
.qv__main img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; opacity: 0; transition: opacity .4s var(--ease); }
.qv__main img.is-on { opacity: 1; }
.qv__dots { position: absolute; left: 0; right: 0; bottom: 8px; display: flex; justify-content: center; }
.qv__dots button { width: 32px; height: 32px; display: grid; place-items: center; }
.qv__dots button::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, .6); box-shadow: 0 1px 3px rgba(43, 33, 28, .35); }
.qv__dots button.is-on::before { background: var(--paper); }
.qv__info { padding: clamp(26px, 3.2vw, 44px); display: flex; flex-direction: column; }
.qv .kicker { font-size: 10.5px; }
.qv__name { font: 300 clamp(26px, 2.2vw, 32px)/1.15 var(--serif); margin: 10px 0 6px; }
.qv__price { font-size: 15px; }
.qv__short { color: var(--muted); margin: 12px 0 0; font-size: 14px; }
.qv .opt { margin-top: 20px; }
.qv .btn { margin-top: 26px; }
.qv__more { margin-top: 16px; align-self: flex-start; }

/* ---------- pages intérieures ---------- */
.phead { padding: clamp(40px, 5vw, 72px) 0 clamp(28px, 3vw, 44px); border-bottom: 1px solid var(--line); }
.phead .h1 { margin-top: 12px; }
.phead--media { border-bottom: 0; }
.phead__in { display: grid; grid-template-columns: 1.1fr .9fr; gap: clamp(28px, 5vw, 80px); align-items: center; }
.phead__pics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: start; }
.phead__pics figure { margin: 0; aspect-ratio: 3 / 4; overflow: hidden; background: var(--creme); }
.phead__pics figure:nth-child(2) { margin-top: 40px; }
.phead__pics img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }
.crumbs a:hover { color: var(--terra-ink); }
.filters, .drawer__panel { background: var(--paper); }
.gallery__thumbs button, .gallery__main, .line__img { background: var(--creme); }
.gallery__count { background: rgba(255, 255, 255, .92); color: var(--brun); }
.pinfo h1 { font-size: clamp(28px, 2.6vw, 38px); font-weight: 300; line-height: 1.12; }
.pinfo .price { font-size: 18px; color: var(--brun); }
.pinfo .short { font: 300 15px/1.7 var(--sans); color: var(--muted); }
.value h3, .pillar h3, .step h3, .craft__item h3 { font-size: 21px; font-weight: 400; }
.step b, .craft__item b, .feature__media .num { font-weight: 300; color: var(--muted); font-size: 30px; }
.pillar { background: var(--paper); }
.pillar svg { stroke: var(--brun); }
.quote blockquote { color: var(--brun); font-size: clamp(24px, 2.4vw, 34px); }
.quote cite, .about-hero .sig, .value b, .box h3 b { color: var(--terra-ink); }
.cta .h1 { color: var(--brun); }
.cta p { color: var(--muted); }
.cta__mono { color: rgba(43, 33, 28, .04); }
.cta .kicker { color: var(--muted); }
.demo-flag b { color: var(--terra-ink); }

/* ---------- pied de page clair ---------- */
.footer { background: var(--creme); color: var(--ink); padding: clamp(56px, 6vw, 84px) 0 28px; font-size: 14px; }
.footer__top { border-bottom-color: var(--line-strong); padding-bottom: 48px; }
.footer .brandf { color: var(--brun); }
.footer .brandf svg.mono { width: 40px; height: 44px; }
.footer__about { color: var(--muted); }
.footer h4 { color: var(--brun); font-size: 11px; letter-spacing: .2em; margin-bottom: 18px; }
.footer ul a, .footer ul li { color: var(--muted); }
.footer a:hover { color: var(--brun); }
.socials a { border-color: var(--line-strong); color: var(--brun); }
.socials a:hover { background: var(--brun); color: var(--paper); border-color: var(--brun); }
.pay-icons span { border-color: var(--line-strong); color: var(--muted); }
.footer__bottom { color: var(--muted); }
.wa-float { background: var(--brun); color: var(--paper); }
.wa-float:hover { background: var(--chocolat); }
.wa-float::before { border-color: var(--brun); }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .nav--main { gap: 18px; }
  .nav a { font-size: 11px; letter-spacing: .12em; }
  .grid4 { grid-template-columns: repeat(3, 1fr); }
  .grid4 > :nth-child(n + 7) { display: none; }
  .serv4__in { grid-template-columns: 1fr 1fr; }
  .serv4__item:nth-child(3) { border-left: 0; }
  .serv4__item:nth-child(n + 3) { border-top: 1px solid var(--line); }
}
@media (max-width: 960px) {
  :root { --header-h: 60px; }
  .nav--main { display: none; }
  .header__in { grid-template-columns: 1fr auto 1fr; padding: 0 12px; }
  .burger { display: grid; justify-self: start; }
  .brand { justify-self: center; }
  .brand svg.word { display: none; }
  .star4__in, .bes4__in, .phead__in { grid-template-columns: 1fr; }
  .bes4__media { aspect-ratio: 4 / 3.6; }
  .cats4 { grid-template-columns: 1fr 1fr; }
  .modal--qv .modal__box { max-height: calc(100vh - 24px); }
  .qv { grid-template-columns: 1fr; }
  .qv__main { aspect-ratio: 4 / 4.4; }
}
@media (max-width: 760px) {
  .hero4 { grid-template-columns: 1fr; }
  .hero4__tile .ph { height: auto; aspect-ratio: 4 / 5; }
  .hero4__tile + .hero4__tile .ph { aspect-ratio: 4 / 3.4; }
  .colls4 { grid-template-columns: 1fr; }
  .coll4 .ph { aspect-ratio: 4 / 3.6; }
}
@media (max-width: 640px) {
  body { font-size: 15px; }
  .announce { font-size: 9.5px; letter-spacing: .16em; padding: 9px 14px; }
  .announce i, .announce span ~ span { display: none; }
  .grid4 { grid-template-columns: 1fr 1fr; gap: 26px 8px; }
  .grid4 > :nth-child(n + 7) { display: none; }
  .tabs4 { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; width: 100%; gap: 18px; }

.hero3d__stage:not(.is-3d) ~ .hero3d__bar .hero3d__hint, .hero3d__stage:not(.is-3d) ~ .hero3d__bar .hero3d__ctrl, .hero3d__stage:not(.is-3d) ~ .hero3d__bar .hero3d__cap { visibility: hidden; }

/* ---------- pile de photos en 3D ---------- */
.star4__media { display: grid; gap: 22px; }
.stack3d { position: relative; aspect-ratio: 4 / 5; perspective: 1600px; perspective-origin: 50% 40%; cursor: pointer; margin-right: 14%; }
.stack3d__card { position: absolute; inset: 0; margin: 0; overflow: hidden; background: var(--creme); box-shadow: 0 30px 60px -36px rgba(43, 33, 28, .55);
  transform: translateX(calc(var(--k) * 9%)) translateZ(calc(var(--k) * -110px)) rotateY(calc(var(--k) * -9deg));
  transform-origin: 50% 50%; opacity: calc(1 - var(--k) * .18);
  transition: transform .8s var(--ease-out), opacity .6s var(--ease), filter .6s; filter: brightness(calc(1 - var(--k) * .06)); }

.stack3d:hover .stack3d__card:not(.is-front) { transform: translateX(calc(var(--k) * 11%)) translateZ(calc(var(--k) * -110px)) rotateY(calc(var(--k) * -11deg)); }

/* ---------- inclinaison des photos ---------- */
.pcard__wrap, .cat4 .ph, .coll4 .ph, .gallery__main { transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .6s var(--ease-out); }
.pcard__wrap.is-tilt, .cat4 .ph.is-tilt, .coll4 .ph.is-tilt, .gallery__main.is-tilt { transition-duration: .15s; box-shadow: 0 24px 50px -30px rgba(43, 33, 28, .55); }

  background: radial-gradient(60% 50% at var(--mx, 50%) var(--my, 50%), rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 70%); transition: opacity .4s; }

.sword--cacao { left: 6vw; top: 30%; font: 500 clamp(90px, 15vw, 250px)/.82 var(--sans); letter-spacing: -.05em; color: var(--chocolat); transform: translateY(calc((0.5 - var(--t, .5)) * 60px)); }
.sword--terra, .sword--choco { left: 50%; top: 52%; font: 500 clamp(56px, 13.6vw, 240px)/.82 var(--sans); letter-spacing: -.05em; transform: translate(-50%, -50%) scale(calc(1 + (var(--t, .5) - .5) * .08)); }

/* couches d'interface */
.sui { position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: var(--a, 0); visibility: hidden; }

@keyframes scrollhint { 0% { transform: scaleY(0); } 50% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }

/* chapitres */
.sui--ch .sui__txt { position: absolute; left: 6vw; top: calc(30% + clamp(90px, 15vw, 250px) * .9); max-width: 380px; display: grid; justify-items: start; gap: 16px; transform: translateY(calc((1 - var(--a, 0)) * 30px)); }

.schips { display: flex; flex-wrap: wrap; gap: 6px; }

.sui__side { position: absolute; left: 6vw; bottom: 9%; max-width: 300px; display: grid; gap: 12px; }

/* carte produit façon publication */
.scard { position: absolute; width: clamp(250px, 22vw, 330px); background: var(--paper); border-radius: 18px; overflow: hidden; box-shadow: 0 40px 80px -40px rgba(43, 33, 28, .55), 0 0 0 1px rgba(43, 33, 28, .06);
  transform: perspective(1400px) translateY(calc((1 - var(--a, 0)) * 80px)) rotateY(calc((var(--t, .5) - .5) * -22deg)) rotateX(calc((var(--t, .5) - .5) * 8deg)); }
