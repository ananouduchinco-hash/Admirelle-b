.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
.kpi { background: var(--white); padding: 20px 22px; border-radius: 3px; }
.kpi small { display: block; font: 500 10.5px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.kpi b { display: block; font: 300 30px/1.2 var(--sans); color: var(--chocolat); margin-top: 10px; }
.kpi span { font-size: 12.5px; color: var(--muted); }
.panel { background: var(--white); border-radius: 3px; padding: 22px; margin-bottom: 18px; }
.panel h2 { font-size: 24px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.cols2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font: 500 10.5px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); padding: 10px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr.click { cursor: pointer; transition: background .2s; }
.tbl tr.click:hover { background: rgba(232, 216, 195, .35); }
.tbl .thumb { width: 44px; height: 58px; object-fit: cover; background: var(--beige); display: block; }
.tbl b { font-weight: 500; color: var(--chocolat); }
.tblwrap { overflow-x: auto; }
.bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.bar input[type=search], .bar select { height: 40px; border: 1px solid var(--line-strong); background: var(--white); padding: 0 12px; border-radius: 3px; font-size: 13.5px; }
.bar input[type=search] { min-width: 240px; }
body.admin .field input, body.admin .field select, body.admin .field textarea { border: 1px solid var(--line-strong); padding: 10px 12px; background: #fff; border-radius: 3px; font-size: 14px; }
body.admin .field > span { font-size: 10px; }
body.admin .form { gap: 16px; }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13.5px; }
.switch input { appearance: none; width: 38px; height: 22px; border-radius: 11px; background: var(--line-strong); position: relative; transition: background .25s; margin: 0; cursor: pointer; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .25s; }
.switch input:checked { background: var(--chocolat); }
.switch input:checked::after { transform: translateX(16px); }
.sheet { position: fixed; inset: 0; z-index: 90; visibility: hidden; }
.sheet.open { visibility: visible; }
.sheet__bg { position: absolute; inset: 0; background: rgba(43, 33, 28, .45); opacity: 0; transition: opacity .35s; }
.sheet.open .sheet__bg { opacity: 1; }
.sheet__panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: #F7F2EA; transform: translateX(100%); transition: transform .5s var(--ease-out); display: flex; flex-direction: column; }
.sheet.open .sheet__panel { transform: none; }
.sheet__head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 24px; border-bottom: 1px solid var(--line); background: var(--white); }
.sheet__head h3 { font-size: 26px; }
.sheet__body { flex: 1; overflow: auto; padding: 22px 24px 40px; }
.sheet__foot { padding: 14px 24px; border-top: 1px solid var(--line); background: var(--white); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 8px 16px; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; color: var(--ink); word-break: break-word; }
.imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.imgs .im { position: relative; aspect-ratio: 3 / 4; background: var(--beige); overflow: hidden; border-radius: 2px; }
.imgs .im img { width: 100%; height: 100%; object-fit: cover; }
.imgs .im .ctl { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; background: rgba(43, 33, 28, .7); }
.imgs .im .ctl button { color: var(--creme); width: 33%; height: 28px; font-size: 13px; }
.imgs .im .first { position: absolute; top: 6px; left: 6px; background: var(--terracotta); color: var(--creme); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; padding: 3px 6px; }
.imgs .add { aspect-ratio: 3 / 4; border: 1px dashed var(--line-strong); display: grid; place-items: center; text-align: center; font-size: 12px; color: var(--muted); cursor: pointer; border-radius: 2px; padding: 8px; }
.imgs .add:hover { border-color: var(--terracotta); color: var(--terracotta); }
.colorrow { display: grid; grid-template-columns: 44px 1fr 36px; gap: 8px; align-items: center; margin-bottom: 8px; }
.colorrow input[type=color] { width: 44px; height: 40px; padding: 2px; border: 1px solid var(--line-strong); border-radius: 3px; background: #fff; }
.colorrow button, .shiprow button { width: 36px; height: 40px; color: var(--muted); }
.colorrow button:hover, .shiprow button:hover { color: #A83B2B; }
.shiprow { display: grid; grid-template-columns: 1.6fr .7fr 1fr auto 36px; gap: 8px; align-items: center; margin-bottom: 8px; }
body.admin .chips .chip { height: 36px; }
.tbl td:first-child b { white-space: nowrap; }
.empty-s { text-align: center; padding: 50px 20px; color: var(--muted); }
.login { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: var(--brun); }
.login .box { width: min(420px, 100%); }
.login .mono { width: 54px; height: 60px; color: var(--chocolat); margin: 0 auto 14px; display: block; }
.timeline { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; font-size: 13px; }
.timeline li { display: flex; gap: 10px; color: var(--muted); }
.timeline li b { color: var(--chocolat); font-weight: 500; }
.adm-menu { display: none; }
.dot-new { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--terracotta); margin-right: 6px; }
.prodcell { display: flex; align-items: center; gap: 12px; }
@media (max-width: 1100px) { .kpis { grid-template-columns: 1fr 1fr; } .cols2 { grid-template-columns: 1fr; } }
@media (max-width: 860px) {
  .adm { grid-template-columns: 1fr; }
  .side { position: fixed; z-index: 70; width: 260px; transform: translateX(-100%); transition: transform .4s var(--ease-out); }
  .side.open { transform: none; box-shadow: 30px 0 60px -30px rgba(0, 0, 0, .5); }
  .adm-menu { display: inline-grid; place-items: center; width: 42px; height: 42px; border: 1px solid var(--line-strong); border-radius: 3px; }
  .top h1 { font-size: 30px; }
  .kv { grid-template-columns: 1fr; }
  .shiprow { grid-template-columns: 1fr 1fr; }
}

</style>
</head>

    fb: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 21v-7.4h2.5l.4-2.9h-2.9V8.9c0-.8.2-1.4 1.4-1.4h1.6V4.9c-.3 0-1.2-.1-2.3-.1-2.3 0-3.8 1.4-3.8 3.9v2.1H7.9v2.9h2.5V21h3.1Z"/></svg>',
    tt: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.6 5.8A4.3 4.3 0 0 1 15.5 3h-3.1v12.4a2.6 2.6 0 1 1-1.8-2.5V9.8a5.7 5.7 0 1 0 4.9 5.6V9.1a7.3 7.3 0 0 0 4.3 1.4V7.4a4.3 4.3 0 0 1-3.2-1.6Z"/></svg>'
  };
  AB.mono = (cls = "mono") => `<svg class="${cls}" aria-hidden="true"><use href="#ab-mono"/></svg>`;
  AB.word = (cls = "word") => `<svg class="${cls}" aria-hidden="true"><use href="#ab-word"/></svg>`;
})();

/* =====================================================================
   ADMIRELLE B — NOYAU COMMUN (site public + admin)
   Utilitaires, accès aux données (Firebase ou mode démo), compte cliente, panier.
   ===================================================================== */
(function () {
  "use strict";
  const CFG = window.AB_CONFIG;
  const DEMO = window.AB_DEMO;
  const AB = (window.AB = window.AB || {});

  AB.isLive = !!(CFG.firebase && CFG.firebase.apiKey && CFG.firebase.projectId);

  /* ---------------- utilitaires ---------------- */
  AB.$ = (s, r = document) => r.querySelector(s);
  AB.$$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  AB.esc = (s) =>
    String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  AB.nl2p = (s) => AB.esc(s).split(/\n{2,}/).map((p) => `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");
  AB.money = (n) => new Intl.NumberFormat("fr-FR").format(Math.round(Number(n) || 0)).replace(/[  ]/g, " ") + " FCFA";
  AB.slugify = (s) =>
    String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 80);
  AB.uid = (n = 8) => Array.from(crypto.getRandomValues(new Uint8Array(n)), (b) => "abcdefghijkmnpqrstuvwxyz23456789"[b % 32]).join("");
  AB.toDate = (v) => (v ? (v.toDate ? v.toDate() : v.seconds ? new Date(v.seconds * 1000) : new Date(v)) : null);
  AB.date = (v, withTime) => {
    const d = AB.toDate(v);
    if (!d || isNaN(d)) return "";
    return d.toLocaleDateString("fr-FR", withTime ? { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" } : { day: "numeric", month: "long", year: "numeric" });
  };
  AB.ls = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  };
  AB.debounce = (fn, ms = 200) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

  /* Images : redimensionnement à la volée pour Unsplash (imgix) et Cloudinary */
  AB.img = (url, w) => {
    if (!url) return "";
    if (window.AB_IMG && window.AB_IMG[url]) return window.AB_IMG[url];
    try {
      if (url.includes("images.unsplash.com")) {
        const u = new URL(url);
        const ow = Number(u.searchParams.get("w")) || 0, oh = Number(u.searchParams.get("h")) || 0;
        u.searchParams.set("w", w);
        if (ow && oh) u.searchParams.set("h", Math.round((w * oh) / ow));
        return u.toString();
      }
      if (url.includes("res.cloudinary.com") && url.includes("/upload/") && !/\/upload\/[^/]*w_\d+/.test(url)) {
        return url.replace("/upload/", `/upload/f_auto,q_auto,c_limit,w_${w}/`);
      }
    } catch (e) { /* url relative */ }
    return url;
  };
  AB.srcset = (url) => (!url || (window.AB_IMG && window.AB_IMG[url]) || !/images\.unsplash\.com|res\.cloudinary\.com/.test(url)) ? "" : [480, 800, 1200].map((w) => `${AB.img(url, w)} ${w}w`).join(", ");

  /* Navigation : par l'adresse (#/page) ou en mémoire (aperçu intégré, où l'adresse n'est pas modifiable) */
  AB.memRoute = !!window.AB_MEMROUTE;
  let memHash = "#/";
  AB.getHash = () => (AB.memRoute ? memHash : location.hash);
  AB.go = (h) => { if (AB.memRoute) { memHash = h; AB.router && AB.router(); } else location.hash = h; };
  AB.replaceHash = (h) => { if (AB.memRoute) memHash = h; else { try { history.replaceState(null, "", h); } catch (e) { /* ignore */ } } };
  if (AB.memRoute) {
    document.addEventListener("click", (e) => {
      const a = e.target.closest && e.target.closest('a[href^="#/"]');
      if (!a || e.defaultPrevented || a.target === "_blank") return;
      e.preventDefault();
      AB.go(a.getAttribute("href"));
    });
  }

  /* Notifications à l'écran */
  AB.toast = (msg, type = "info", ms = 3800) => {
    let box = AB.$(".toasts");
    if (!box) { box = document.createElement("div"); box.className = "toasts"; box.setAttribute("role", "status"); document.body.appendChild(box); }
    const t = document.createElement("div");
    t.className = `toast toast--${type}`;
    t.innerHTML = AB.esc(msg);
    box.appendChild(t);
    requestAnimationFrame(() => t.classList.add("in"));
    setTimeout(() => { t.classList.remove("in"); setTimeout(() => t.remove(), 400); }, ms);
  };

  /* Lien WhatsApp */
  AB.wa = (number, text) => `https://wa.me/${String(number || "").replace(/\D/g, "")}?text=${encodeURIComponent(text || "")}`;

  /* ---------------- Firebase (chargé seulement si configuré) ---------------- */
  let fbPromise = null;
  AB.fb = () => {
    if (!AB.isLive) return Promise.resolve(null);
    if (!fbPromise) {
      const base = `https://www.gstatic.com/firebasejs/${CFG.firebaseSdk}/`;
      fbPromise = Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")])
        .then(([A, Au, F]) => {
          const app = A.initializeApp(CFG.firebase);
          return { app, auth: Au.getAuth(app), db: F.getFirestore(app), Au, F };
        })
        .catch((e) => { console.error("Firebase", e); AB.toast("Connexion à la base de données impossible.", "error"); throw e; });
    }
    return fbPromise;
  };

  /* ---------------- Base de démonstration (navigateur) ---------------- */
  const SEED = { products: () => DEMO.products, collections: () => DEMO.collections };
  const demo = {
    key: (c) => "ab_db2_" + c,
    all(c) {
      let rows = AB.ls.get(this.key(c), null);
      if (!rows) { rows = SEED[c] ? JSON.parse(JSON.stringify(SEED[c]())) : []; AB.ls.set(this.key(c), rows); }
      return rows;
    },
    put(c, doc) {
      const rows = this.all(c);
      const i = rows.findIndex((r) => r.id === doc.id);
      if (i >= 0) rows[i] = { ...rows[i], ...doc }; else rows.unshift(doc);
      if (!AB.ls.set(this.key(c), rows)) throw new Error("Stockage du navigateur plein (mode démo).");
      window.dispatchEvent(new CustomEvent("ab:demo", { detail: c }));
      return doc;
    },
    del(c, id) {
      AB.ls.set(this.key(c), this.all(c).filter((r) => r.id !== id));
      window.dispatchEvent(new CustomEvent("ab:demo", { detail: c }));
    }
  };
  AB.demo = demo;

  /* ---------------- Accès aux données (générique) ---------------- */
  const norm = (snap) => ({ id: snap.id, ...snap.data() });
  AB.store = {
    async list(col, opt = {}) {
      const fb = await AB.fb();
      if (!fb) {
        let rows = demo.all(col).slice();
        if (opt.where) rows = rows.filter((r) => r[opt.where[0]] === opt.where[2]);
        return rows;
      }
      const { F, db } = fb;
      const parts = [F.collection(db, col)];
      if (opt.where) parts.push(F.where(...opt.where));
      if (opt.orderBy) parts.push(F.orderBy(...opt.orderBy));
      if (opt.limit) parts.push(F.limit(opt.limit));
      const snap = await F.getDocs(F.query(...parts));
      return snap.docs.map(norm);
    },
    async get(col, id) {
      const fb = await AB.fb();
      if (!fb) return demo.all(col).find((r) => r.id === id) || null;
      const s = await fb.F.getDoc(fb.F.doc(fb.db, col, id));
      return s.exists() ? norm(s) : null;
    },
    async save(col, id, data) {
      const fb = await AB.fb();
      const doc = { ...data, updatedAt: fb ? fb.F.serverTimestamp() : Date.now() };
      delete doc.id;
      if (!fb) return demo.put(col, { id, ...doc });
      await fb.F.setDoc(fb.F.doc(fb.db, col, id), doc, { merge: true });
      return { id, ...data };
    },
    async add(col, data) {
      const fb = await AB.fb();
      if (!fb) { const id = AB.uid(12); return demo.put(col, { id, ...data, createdAt: Date.now() }); }
      const ref = await fb.F.addDoc(fb.F.collection(fb.db, col), { ...data, createdAt: fb.F.serverTimestamp() });
      return { id: ref.id, ...data };
    },
    async remove(col, id) {
      const fb = await AB.fb();
      if (!fb) return demo.del(col, id);
      await fb.F.deleteDoc(fb.F.doc(fb.db, col, id));
    },
    /* écoute en temps réel (admin) */
    async watch(col, cb, opt = {}) {
      const fb = await AB.fb();
      if (!fb) {
        const run = () => cb(demo.all(col).slice());
        run();
        const h = (e) => { if (!e.detail || e.detail === col) run(); };
        window.addEventListener("ab:demo", h);
        window.addEventListener("storage", run);
        return () => { window.removeEventListener("ab:demo", h); window.removeEventListener("storage", run); };
      }
      const { F, db } = fb;
      const parts = [F.collection(db, col)];
      if (opt.orderBy) parts.push(F.orderBy(...opt.orderBy));
      return F.onSnapshot(F.query(...parts), (s) => cb(s.docs.map(norm)), (e) => { console.error(e); AB.toast("Lecture impossible : " + e.message, "error"); });
    }
  };

  /* ---------------- Contenus du site ---------------- */
  let settingsCache = null, productsCache = null;
  AB.data = {
    categories: DEMO.categories,
    sizeGuide: DEMO.sizeGuide,
    async settings(force) {
      if (settingsCache && !force) return settingsCache;
      let s = null;
      try { s = await AB.store.get("settings", "site"); } catch (e) { console.warn(e); }
      settingsCache = { ...window.AB_DEFAULT_SETTINGS, ...(s || {}) };
      settingsCache.socials = { ...window.AB_DEFAULT_SETTINGS.socials, ...((s && s.socials) || {}) };
      if (!Array.isArray(settingsCache.shipping) || !settingsCache.shipping.length) settingsCache.shipping = window.AB_DEFAULT_SETTINGS.shipping;
      return settingsCache;
    },
    async products(force) {
      if (productsCache && !force) return productsCache;
      let rows = [];
      try { rows = await AB.store.list("products", { where: ["published", "==", true] }); } catch (e) { console.warn(e); }
      if (!rows.length && !AB.isLive) rows = DEMO.products;
      rows.sort((a, b) => (a.order ?? 999) - (b.order ?? 999));
      productsCache = rows;
      return rows;
    },
    async product(slug) {
      const rows = await this.products();
      return rows.find((p) => p.slug === slug || p.id === slug) || null;
    },
    async collections() {
      let rows = [];
      try { rows = await AB.store.list("collections"); } catch (e) { console.warn(e); }
      if (!rows.length && !AB.isLive) rows = DEMO.collections;
      return rows.filter((c) => c.published !== false).sort((a, b) => (a.order ?? 99) - (b.order ?? 99));
    }
  };

  /* ---------------- Envoi de photos (Cloudinary, ou réduction locale en démo) ---------------- */
  AB.upload = async (file, folder = "admirelle-b") => {
    if (!file || !/^image\//.test(file.type)) throw new Error("Choisissez une image (JPG, PNG ou WebP).");
    if (file.size > 12 * 1024 * 1024) throw new Error("Image trop lourde (12 Mo maximum).");
    const cl = CFG.cloudinary || {};
    if (cl.cloudName && cl.uploadPreset) {
      const fd = new FormData();
      fd.append("file", file);
      fd.append("upload_preset", cl.uploadPreset);
      fd.append("folder", folder);
      const r = await fetch(`https://api.cloudinary.com/v1_1/${cl.cloudName}/image/upload`, { method: "POST", body: fd });
      const j = await r.json();
      if (!r.ok) throw new Error((j.error && j.error.message) || "Envoi de l'image impossible.");
      return j.secure_url;
    }
    if (AB.isLive) throw new Error("Cloudinary n'est pas configuré : ajoutez cloudName et uploadPreset dans config.js.");
    // Mode démo : image réduite stockée dans le navigateur
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 900 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.8);
  };

  /* ---------------- Appels aux fonctions serveur ---------------- */
  AB.api = async (name, body, method = "POST") => {
    const headers = { "Content-Type": "application/json" };
    const u = await AB.auth.user();
    if (u && u.getIdToken) headers.Authorization = "Bearer " + (await u.getIdToken());
    const url = `${CFG.functionsBase}/${name}` + (method === "GET" && body ? "?" + new URLSearchParams(body) : "");
    const r = await fetch(url, { method, headers, body: method === "GET" ? undefined : JSON.stringify(body || {}) });
    let j = {};
    try { j = await r.json(); } catch (e) { /* vide */ }
    if (!r.ok) throw new Error(j.error || `Erreur serveur (${r.status}).`);
    return j;
  };

  /* ---------------- Compte cliente ---------------- */
  const listeners = new Set();
  let current = null, ready = false;
  const emit = () => listeners.forEach((cb) => cb(current));
  AB.auth = {
    get current() { return current; },
    onChange(cb) { listeners.add(cb); if (ready) cb(current); return () => listeners.delete(cb); },
    async init() {
      const fb = await AB.fb();
      if (!fb) {
        const s = AB.ls.get("ab_demo_session", null);
        current = s ? { uid: s.uid, email: s.email, displayName: s.name, demo: true } : null;
        ready = true; emit(); return;
      }
      fb.Au.onAuthStateChanged(fb.auth, (u) => { current = u; ready = true; emit(); });
    },
    async user() { return current; },
    async signUp(name, email, password) {
      const fb = await AB.fb();
      if (!fb) {
        const users = AB.ls.get("ab_demo_users", {});
        if (users[email]) throw new Error("Un compte existe déjà avec cette adresse.");
        const uid = "demo_" + AB.uid(10);
        users[email] = { uid, name, password };
        AB.ls.set("ab_demo_users", users);
        AB.ls.set("ab_demo_session", { uid, email, name });
        demo.put("customers", { id: uid, name, email, createdAt: Date.now() });
        current = { uid, email, displayName: name, demo: true }; emit(); return current;
      }
      const cred = await fb.Au.createUserWithEmailAndPassword(fb.auth, email, password);
      await fb.Au.updateProfile(cred.user, { displayName: name });
      await fb.F.setDoc(fb.F.doc(fb.db, "customers", cred.user.uid), { name, email, createdAt: fb.F.serverTimestamp() }, { merge: true });
      current = cred.user; emit(); return current;
    },
    async signIn(email, password) {
      const fb = await AB.fb();
      if (!fb) {
        const u = AB.ls.get("ab_demo_users", {})[email];
        if (!u || u.password !== password) throw new Error("Adresse e-mail ou mot de passe incorrect.");
        AB.ls.set("ab_demo_session", { uid: u.uid, email, name: u.name });
        current = { uid: u.uid, email, displayName: u.name, demo: true }; emit(); return current;
      }
      const cred = await fb.Au.signInWithEmailAndPassword(fb.auth, email, password);
      return cred.user;
    },
    async signOut() {
      const fb = await AB.fb();
      if (!fb) { localStorage.removeItem("ab_demo_session"); current = null; emit(); return; }
      await fb.Au.signOut(fb.auth);
    },
    async reset(email) {
      const fb = await AB.fb();
      if (!fb) throw new Error("Disponible une fois Firebase configuré.");
      await fb.Au.sendPasswordResetEmail(fb.auth, email);
    },
    async profile() {
      if (!current) return null;
      return (await AB.store.get("customers", current.uid)) || { name: current.displayName || "", email: current.email };
    },
    async saveProfile(data) {
      if (!current) throw new Error("Non connectée.");
      const clean = { name: data.name || "", phone: data.phone || "", address: data.address || "", city: data.city || "", email: current.email };
      return AB.store.save("customers", current.uid, clean);
    },
    async orders() {
      if (!current) return [];
      const rows = await AB.store.list("orders", { where: ["uid", "==", current.uid] });
      return rows.sort((a, b) => (AB.toDate(b.createdAt) || 0) - (AB.toDate(a.createdAt) || 0));
    }
  };
  AB.authError = (e) => {
    const m = String((e && (e.code || e.message)) || e);
    if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(m)) return "Adresse e-mail ou mot de passe incorrect.";
    if (/email-already-in-use/.test(m)) return "Un compte existe déjà avec cette adresse.";
    if (/weak-password/.test(m)) return "Le mot de passe doit contenir au moins 6 caractères.";
    if (/invalid-email/.test(m)) return "Adresse e-mail invalide.";
    if (/too-many-requests/.test(m)) return "Trop de tentatives. Réessayez dans quelques minutes.";
    if (/network/.test(m)) return "Connexion internet indisponible.";
    return e && e.message ? e.message : m;
  };

  /* ---------------- Panier ---------------- */
  const CART_KEY = "ab_cart";
  AB.cart = {
    items() { return AB.ls.get(CART_KEY, []); },
    save(items) { AB.ls.set(CART_KEY, items); window.dispatchEvent(new CustomEvent("ab:cart", { detail: items })); },
    add(p, size, color, qty = 1) {
      const items = this.items();
      const key = [p.id, size, color].join("|");
      const it = items.find((i) => i.key === key);
      if (it) it.qty = Math.min(20, it.qty + qty);
      else items.push({ key, id: p.id, slug: p.slug, name: p.name, price: p.price, priceFrom: !!p.priceFrom, image: (p.images || [])[0] || "", size, color, qty });
      this.save(items);
    },
    setQty(key, qty) {
      const items = this.items().map((i) => (i.key === key ? { ...i, qty: Math.max(1, Math.min(20, qty)) } : i));
      this.save(items);
    },
    remove(key) { this.save(this.items().filter((i) => i.key !== key)); },
    clear() { this.save([]); },
    count() { return this.items().reduce((s, i) => s + i.qty, 0); },
    subtotal() { return this.items().reduce((s, i) => s + i.price * i.qty, 0); }
  };

  /* Libellés */
  AB.LABELS = {
    status: {
      en_attente_paiement: "En attente de paiement", nouvelle: "Nouvelle", confirmee: "Confirmée", en_confection: "En confection",
      prete: "Prête", expediee: "Expédiée", livree: "Livrée", annulee: "Annulée"
    },
    payment: { en_attente: "En attente", payee: "Payée", echouee: "Échouée", a_confirmer: "À confirmer (WhatsApp)", remboursee: "Remboursée" },
    availability: { en_stock: "En stock", sur_commande: "Sur commande", epuise: "Épuisé" },
    request: { nouvelle: "Nouvelle", devis_envoye: "Devis envoyé", acceptee: "Acceptée", en_confection: "En confection", terminee: "Terminée", annulee: "Annulée" }
  };
})();

/* =====================================================================
   ADMIRELLE B — TABLEAU DE BORD (espace privé de la styliste)
   ===================================================================== */
(function () {
  "use strict";
  const { $, $$, esc, money, img, I } = AB;
  const L = AB.LABELS;
  const ST = { tab: "dashboard", user: null, orders: [], products: [], collections: [], requests: [], messages: [], customers: [], settings: null, seen: new Set(), first: true, f: {} };
  const CATS = AB.data.categories;
  const SIZES = ["XS", "S", "M", "L", "XL", "XXL", "Sur mesure"];
  const NAV = [["dashboard", "Tableau de bord"], ["orders", "Commandes"], ["payments", "Paiements"], ["products", "Produits"], ["collections", "Collections"], ["requests", "Sur-mesure"], ["messages", "Messages"], ["customers", "Clientes"], ["settings", "Paramètres du site"]];

  const pill = (t, k) => `<span class="pill pill--${k}">${esc(t)}</span>`;
  const stPill = (s) => pill(L.status[s] || s || "—", ["livree", "confirmee", "prete", "expediee"].includes(s) ? "ok" : s === "annulee" ? "bad" : s === "nouvelle" ? "dark" : "wait");
  const payPill = (p = {}) => pill(L.payment[p.status] || "—", p.status === "payee" ? "ok" : p.status === "echouee" ? "bad" : "wait");
  const reqPill = (s) => pill(L.request[s] || s || "—", s === "nouvelle" ? "dark" : s === "annulee" ? "bad" : ["terminee", "acceptee"].includes(s) ? "ok" : "wait");
  const ts = (v) => (AB.toDate(v) || new Date(0)).getTime();
  const byDate = (a, b) => ts(b.createdAt) - ts(a.createdAt);
  const catName = (id) => (CATS.find((c) => c.id === id) || {}).name || id || "";
  const first = (n) => String(n || "").split(" ")[0];
  const S = () => ST.settings || window.AB_DEFAULT_SETTINGS;

  /* ---------------- connexion ---------------- */
  async function boot() {
    if (!AB.isLive) return loginView(true);
    const fb = await AB.fb();
    fb.Au.onAuthStateChanged(fb.auth, async (u) => {
      if (!u) return loginView(false);
      let adm = null;
      try { adm = await AB.store.get("admins", u.uid); } catch (e) { console.warn(e); }
      if (!adm) return notAdmin(u);
      start(u);
    });
  }
  function loginView(demo) {
    $("#app").innerHTML = `<div class="login"><form class="box form" id="lf" novalidate>
      ${AB.mono()}<h3 style="justify-content:center;text-align:center;display:block">Administration</h3>
      ${demo ? `<p class="notice">Mode démo : Firebase n'est pas encore configuré. Les modifications sont enregistrées dans ce navigateur uniquement et apparaissent sur le site ouvert dans ce même navigateur.</p>
        <button class="btn btn--terra" type="submit">Entrer dans la démo</button>`
      : `<label class="field"><span>E-mail</span><input name="email" type="email" autocomplete="username"></label>
        <label class="field"><span>Mot de passe</span><input name="pw" type="password" autocomplete="current-password"></label>
        <button class="btn" type="submit">Se connecter</button><button type="button" class="link" id="reset" style="justify-self:center">Mot de passe oublié</button>`}
      <a href="index.html" class="small muted" style="text-align:center">← Retour au site</a></form></div>`;
    const f = $("#lf");
    f.onsubmit = async (e) => {
      e.preventDefault();
      if (demo) return start({ email: "démo", uid: "demo" });
      const b = f.querySelector("[type=submit]"); b.classList.add("is-loading");
      try { await AB.auth.signIn(f.elements.email.value.trim(), f.elements.pw.value); }
      catch (err) { AB.toast(AB.authError(err), "error"); b.classList.remove("is-loading"); }
    };
    const r = $("#reset");
    if (r) r.onclick = async () => { try { await AB.auth.reset(f.elements.email.value.trim()); AB.toast("Lien de réinitialisation envoyé.", "success"); } catch (e) { AB.toast(AB.authError(e), "error"); } };
  }
  function notAdmin(u) {
    $("#app").innerHTML = `<div class="login"><div class="box form">${AB.mono()}<h3 style="display:block;text-align:center">Accès refusé</h3>
      <p>Le compte <b>${esc(u.email)}</b> n'est pas administrateur.</p>
      <p class="small">Pour lui donner l'accès : console Firebase > Firestore > collection <b>admins</b> > nouveau document avec l'identifiant :</p>
      <input class="field" readonly value="${esc(u.uid)}" onclick="this.select()" style="padding:10px;border:1px solid var(--line-strong);font-size:13px">
      <button class="btn btn--ghost" id="out">Se déconnecter</button></div></div>`;
    $("#out").onclick = () => AB.auth.signOut();
  }

  /* ---------------- coque ---------------- */
  async function start(user) {
    ST.user = user;
    try { ST.settings = await AB.data.settings(true); } catch (e) { console.warn(e); }
    $("#app").innerHTML = `<div class="adm">
      <aside class="side" id="side"><div class="side__brand">${AB.mono()}<div><b>Admirelle B</b><small>Administration</small></div></div>
        <nav id="nav">${NAV.map(([k, t]) => `<button data-tab="${k}">${t}<span class="n" data-badge="${k}" hidden></span></button>`).join("")}</nav>
        <div class="side__foot"><span>${esc(user.email)}${AB.isLive ? "" : " · mode démo"}</span><a href="index.html" target="_blank">Voir le site ↗</a><button id="logout">Se déconnecter</button></div></aside>
      <main class="main" id="main"></main></div>
      <div class="sheet" id="sheet"><div class="sheet__bg" data-x></div><div class="sheet__panel"><div class="sheet__head"><h3 id="shT"></h3><button class="tool" data-x aria-label="Fermer">${I.close}</button></div><div class="sheet__body" id="shB"></div><div class="sheet__foot" id="shF"></div></div></div>`;
    $("#nav").onclick = (e) => { const b = e.target.closest("[data-tab]"); if (b) go(b.dataset.tab); };
    $("#logout").onclick = async () => { if (AB.isLive) await AB.auth.signOut(); else loginView(true); };
    $("#sheet").addEventListener("click", (e) => { if (e.target.closest("[data-x]")) closeSheet(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
    const watch = (col, key, opt) => AB.store.watch(col, (rows) => { ST[key] = rows.sort(byDate); onData(key); }, opt);
    watch("orders", "orders", AB.isLive ? { orderBy: ["createdAt", "desc"] } : {});
    watch("customRequests", "requests");
    watch("messages", "messages");
    AB.store.watch("products", (rows) => { ST.products = rows.sort((a, b) => (a.order ?? 999) - (b.order ?? 999)); onData("products"); });
    AB.store.watch("collections", (rows) => { ST.collections = rows.sort((a, b) => (a.order ?? 99) - (b.order ?? 99)); onData("collections"); });
    go(location.hash.replace("#", "") || "dashboard");
  }
  function onData(key) {
    if (key === "orders") {
      const fresh = ST.orders.filter((o) => !ST.seen.has(o.id));
      fresh.forEach((o) => ST.seen.add(o.id));
      if (!ST.first && fresh.length) fresh.forEach((o) => {
        const msg = `Nouvelle commande ${o.number} · ${money(o.total)} · ${o.customer ? o.customer.nom : ""}`;
        AB.toast(msg, "success", 7000);
        try { if ("Notification" in window && Notification.permission === "granted") new Notification("Admirelle B", { body: msg }); } catch (e) { /* ignore */ }
      });
      ST.first = false;
    }
    badges();
    const map = { dashboard: ["orders", "requests", "messages", "products"], orders: ["orders"], payments: ["orders"], products: ["products", "collections"], collections: ["collections", "products"], requests: ["requests"], messages: ["messages"], customers: ["orders"] };
    if ((map[ST.tab] || []).includes(key)) renderList();
  }
  function badges() {
    const set = (k, n) => { const b = $(`[data-badge="${k}"]`); if (b) { b.textContent = n; b.hidden = !n; } };
    set("orders", ST.orders.filter((o) => o.status === "nouvelle" || (o.status === "confirmee" && !o.vu)).length);
    set("requests", ST.requests.filter((r) => r.status === "nouvelle").length);
    set("messages", ST.messages.filter((m) => !m.lu).length);
  }
  function go(tab) {
    if (!VIEWS[tab]) tab = "dashboard";
    ST.tab = tab;
    history.replaceState(null, "", "#" + tab);
    $$("#nav [data-tab]").forEach((b) => b.classList.toggle("is-on", b.dataset.tab === tab));
    $("#side").classList.remove("open");
    VIEWS[tab]();
  }
  function page(title, acts, body) {
    $("#main").innerHTML = `<div class="top"><div style="display:flex;gap:12px;align-items:center"><button class="adm-menu" id="menu" aria-label="Menu">≡</button><h1>${title}</h1></div><div class="acts">${acts || ""}</div></div>${body}`;
    $("#menu").onclick = () => $("#side").classList.toggle("open");
  }
  let listFn = null;
  function renderList() { if (listFn) listFn(); }

  /* ---------------- volet latéral ---------------- */
  function openSheet(title, body, foot, mount) {
    $("#shT").textContent = title; $("#shB").innerHTML = body; $("#shF").innerHTML = foot || "";
    $("#sheet").classList.add("open"); $("#shB").scrollTop = 0;
    if (mount) mount($("#sheet"));
  }
  function closeSheet() { $("#sheet") && $("#sheet").classList.remove("open"); }

  /* =====================================================================
     TABLEAU DE BORD
     ===================================================================== */
  function dashboard() {
    page("Tableau de bord", `<button class="btn btn--ghost btn--sm" id="notif">Activer les notifications</button><button class="btn btn--sm" id="np">Nouveau produit</button>`, `<div id="list"></div>`);
    $("#notif").onclick = async () => {
      if (!("Notification" in window)) return AB.toast("Votre navigateur ne gère pas les notifications.");
      const p = await Notification.requestPermission();
      AB.toast(p === "granted" ? "Notifications activées : vous serez prévenue à chaque nouvelle commande tant que cette page est ouverte." : "Notifications refusées.");
    };
    $("#np").onclick = () => { go("products"); productSheet(null); };
    listFn = () => {
      const now = new Date(), m0 = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
      const paid = ST.orders.filter((o) => (o.payment || {}).status === "payee");
      const month = paid.filter((o) => ts(o.payment.paidAt || o.createdAt) >= m0).reduce((s, o) => s + (o.total || 0), 0);
      const todo = ST.orders.filter((o) => ["nouvelle", "confirmee", "en_confection", "prete"].includes(o.status));
      const pend = ST.orders.filter((o) => ["en_attente", "a_confirmer"].includes((o.payment || {}).status) && o.status !== "annulee");
      const best = {};
      paid.forEach((o) => (o.items || []).forEach((i) => { best[i.name] = (best[i.name] || 0) + i.qty; }));
      const bestList = Object.entries(best).sort((a, b) => b[1] - a[1]).slice(0, 5);
      const low = ST.products.filter((p) => typeof p.stock === "number" && p.stock <= 3 && p.availability !== "sur_commande");
      $("#list").innerHTML = `<div class="kpis">
          <div class="kpi"><small>Encaissé ce mois</small><b>${money(month)}</b><span>${paid.length} commande(s) payée(s) au total</span></div>
          <div class="kpi"><small>Commandes à traiter</small><b>${todo.length}</b><span>nouvelles, confirmées ou en confection</span></div>
          <div class="kpi"><small>Paiements en attente</small><b>${pend.length}</b><span>${money(pend.reduce((s, o) => s + (o.total || 0), 0))}</span></div>
          <div class="kpi"><small>Sur-mesure et messages</small><b>${ST.requests.filter((r) => r.status === "nouvelle").length} · ${ST.messages.filter((m) => !m.lu).length}</b><span>nouvelles demandes · messages non lus</span></div></div>
        <div class="cols2"><div class="panel"><h2>Dernières commandes <button class="link" data-go="orders">Tout voir</button></h2>${ordersTable(ST.orders.slice(0, 8))}</div>
          <div><div class="panel"><h2>Meilleures ventes</h2>${bestList.length ? `<table class="tbl">${bestList.map(([n, q]) => `<tr><td>${esc(n)}</td><td style="text-align:right">${q} vendu(s)</td></tr>`).join("")}</table>` : `<p class="muted">Les ventes payées apparaîtront ici.</p>`}</div>
            <div class="panel"><h2>Stock faible</h2>${low.length ? `<table class="tbl">${low.map((p) => `<tr class="click" data-prod="${esc(p.id)}"><td>${esc(p.name)}</td><td style="text-align:right">${p.stock} restant(s)</td></tr>`).join("")}</table>` : `<p class="muted">Aucune pièce en stock faible.</p>`}</div></div></div>`;
      bindOrderRows($("#list"));
      $$("[data-go]", $("#main")).forEach((b) => (b.onclick = () => go(b.dataset.go)));
      $$("[data-prod]", $("#list")).forEach((r) => (r.onclick = () => productSheet(ST.products.find((p) => p.id === r.dataset.prod))));
    };
    listFn();
  }

  /* =====================================================================
     COMMANDES
     ===================================================================== */
  function ordersTable(rows) {
    if (!rows.length) return `<div class="empty-s">Aucune commande pour le moment.</div>`;
    return `<div class="tblwrap"><table class="tbl"><thead><tr><th>N°</th><th>Date</th><th>Cliente</th><th>Total</th><th>Paiement</th><th>Statut</th></tr></thead><tbody>
      ${rows.map((o) => `<tr class="click" data-order="${esc(o.id)}"><td><b>${o.status === "nouvelle" ? '<i class="dot-new"></i>' : ""}${esc(o.number)}</b></td><td>${AB.date(o.createdAt, true)}</td>
        <td>${esc((o.customer || {}).nom)}<div class="small muted">${esc((o.customer || {}).tel)}</div></td><td>${money(o.total)}</td><td>${payPill(o.payment)}<div class="small muted">${esc((o.payment || {}).provider || "")}</div></td><td>${stPill(o.status)}</td></tr>`).join("")}
    </tbody></table></div>`;
  }
  function bindOrderRows(root) { $$("[data-order]", root).forEach((r) => (r.onclick = () => orderSheet(r.dataset.order))); }
  function ordersView() {
    const f = ST.f.orders || (ST.f.orders = { q: "", st: "", pay: "" });
    page("Commandes", "", `<div class="panel"><div class="bar"><input type="search" id="q" placeholder="N°, nom, téléphone…" value="${esc(f.q)}">
      <select id="st"><option value="">Tous les statuts</option>${Object.entries(L.status).map(([k, v]) => `<option value="${k}" ${f.st === k ? "selected" : ""}>${v}</option>`).join("")}</select>
      <select id="pay"><option value="">Tous les paiements</option>${Object.entries(L.payment).map(([k, v]) => `<option value="${k}" ${f.pay === k ? "selected" : ""}>${v}</option>`).join("")}</select>
      <span class="muted small" id="cnt"></span></div><div id="list"></div></div>`);
    const upd = () => { f.q = $("#q").value.toLowerCase(); f.st = $("#st").value; f.pay = $("#pay").value; listFn(); };
    $("#q").oninput = AB.debounce(upd, 150); $("#st").onchange = upd; $("#pay").onchange = upd;
    listFn = () => {
      const rows = ST.orders.filter((o) => (!f.st || o.status === f.st) && (!f.pay || (o.payment || {}).status === f.pay) &&
        (!f.q || [o.number, (o.customer || {}).nom, (o.customer || {}).tel, (o.customer || {}).email].join(" ").toLowerCase().includes(f.q)));
      $("#cnt").textContent = `${rows.length} commande(s)`;
      $("#list").innerHTML = ordersTable(rows); bindOrderRows($("#list"));
    };
    listFn();
  }
  function orderSheet(id) {
    const o = ST.orders.find((x) => x.id === id);
    if (!o) return;
    const c = o.customer || {}, p = o.payment || {};
    const waMsg = (st) => `Bonjour ${first(c.nom)}, ici Admirelle B. Votre commande ${o.number} est ${(L.status[st] || st).toLowerCase()}. Merci pour votre confiance !`;
    openSheet(`Commande ${o.number}`, `
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px">${stPill(o.status)}${payPill(p)}<span class="pill">${AB.date(o.createdAt, true)}</span></div>
      <div class="panel"><h2>Articles</h2>${(o.items || []).map((i) => `<div class="line" style="grid-template-columns:56px 1fr auto"><div class="line__img">${i.image ? `<img src="${esc(img(i.image, 200))}" alt="">` : ""}</div><div><div class="line__name">${esc(i.name)}</div><div class="line__meta">${esc(i.color)} · ${esc(i.size)} · x${i.qty} · ${money(i.price)}</div></div><b>${money(i.price * i.qty)}</b></div>`).join("")}
        <div class="totals" style="margin-top:14px"><div><span>Sous-total</span><span>${money(o.subtotal)}</span></div><div><span>Livraison · ${esc(o.zoneLabel || "")}</span><span>${o.quote ? "Sur devis" : money(o.shippingFee || 0)}</span></div><div class="grand"><span>Total</span><span>${money(o.total)}</span></div></div></div>
      <div class="panel"><h2>Cliente</h2><dl class="kv"><dt>Nom</dt><dd>${esc(c.nom)}</dd><dt>Téléphone</dt><dd><a href="tel:${esc(c.tel)}">${esc(c.tel)}</a> · <a href="${AB.wa(c.tel, "")}" target="_blank" style="text-decoration:underline">WhatsApp</a></dd>
        <dt>E-mail</dt><dd><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></dd><dt>Livraison</dt><dd>${esc(o.zoneLabel || "")}${c.adresse ? `<br>${esc(c.adresse)}, ${esc(c.ville)}` : ""}</dd>${c.notes ? `<dt>Instructions</dt><dd>${esc(c.notes)}</dd>` : ""}<dt>Compte cliente</dt><dd>${o.uid ? "Oui" : "Commande sans compte"}</dd></dl></div>
      <div class="panel"><h2>Paiement</h2><dl class="kv"><dt>Moyen</dt><dd>${esc(p.provider || p.method || "")}${p.mode ? ` · ${esc(p.mode)}` : ""}${p.manual ? " · validé manuellement" : ""}</dd><dt>Statut</dt><dd>${payPill(p)}</dd>
        ${p.transactionId ? `<dt>Transaction FedaPay</dt><dd>${esc(p.transactionId)} ${p.reference ? `· ${esc(p.reference)}` : ""} (${esc(p.env || "")})</dd>` : ""}${p.paidAt ? `<dt>Payée le</dt><dd>${AB.date(p.paidAt, true)}</dd>` : ""}${p.anomaly ? `<dt>Anomalie</dt><dd style="color:#A83B2B">${esc(p.anomaly)}</dd>` : ""}</dl>
        ${p.status !== "payee" ? `<button class="btn btn--ghost btn--sm" id="markPaid" style="margin-top:16px">Marquer comme payée (paiement reçu hors site)</button>` : ""}</div>
      <div class="panel"><h2>Suivi</h2><div class="form"><label class="field"><span>Statut de la commande</span><select id="ost">${Object.entries(L.status).map(([k, v]) => `<option value="${k}" ${o.status === k ? "selected" : ""}>${v}</option>`).join("")}</select></label>
        <label class="field"><span>Note interne</span><textarea id="onote" placeholder="Visible uniquement dans l'admin">${esc(o.note || "")}</textarea></label></div>
        <ul class="timeline" style="margin-top:16px">${(o.history || []).slice().reverse().map((h) => `<li><span>${AB.date(h.at, true)}</span><b>${esc(L.status[h.status] || h.status)}</b><span>${esc(h.by || "")}</span></li>`).join("")}</ul></div>`,
      `<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn--sm" id="osave">Enregistrer</button><a class="btn btn--ghost btn--sm" id="owa" target="_blank" rel="noopener">Prévenir sur WhatsApp</a></div><button class="btn btn--ghost btn--sm" id="odel">Supprimer</button>`,
      (root) => {
        const sel = $("#ost", root), wa = $("#owa", root);
        const upWa = () => { wa.href = AB.wa(c.tel, waMsg(sel.value)); };
        sel.onchange = upWa; upWa();
        $("#osave", root).onclick = async () => {
          const data = { note: $("#onote", root).value, vu: true };
          if (sel.value !== o.status) { data.status = sel.value; data.history = [...(o.history || []), { status: sel.value, at: new Date().toISOString(), by: ST.user.email }]; }
          try { await AB.store.save("orders", o.id, data); AB.toast("Commande mise à jour.", "success"); closeSheet(); } catch (e) { AB.toast(e.message, "error"); }
        };
        const mp = $("#markPaid", root);
        if (mp) mp.onclick = async () => {
          if (!confirm(`Confirmer que ${money(o.total)} ont bien été reçus pour la commande ${o.number} ?`)) return;
          const now = new Date().toISOString();
          try {
            await AB.store.save("orders", o.id, { payment: { ...p, status: "payee", paidAt: now, manual: true }, status: o.status === "nouvelle" || o.status === "en_attente_paiement" ? "confirmee" : o.status, history: [...(o.history || []), { status: "confirmee", at: now, by: ST.user.email + " (paiement reçu)" }] });
            AB.toast("Paiement enregistré.", "success"); closeSheet();
          } catch (e) { AB.toast(e.message, "error"); }
        };
        $("#odel", root).onclick = async () => { if (confirm(`Supprimer définitivement la commande ${o.number} ?`)) { await AB.store.remove("orders", o.id); AB.toast("Commande supprimée."); closeSheet(); } };
        if (!o.vu) AB.store.save("orders", o.id, { vu: true }).catch(() => {});
      });
  }

  /* =====================================================================
     PAIEMENTS
     ===================================================================== */

        <div class="row"><label class="field"><span>Catégorie</span><select name="category">${opt(CATS.map((c) => [c.id, c.name]), d.category)}</select></label>
          <label class="field"><span>Collection</span><select name="collection"><option value="">Aucune</option>${opt(ST.collections.map((c) => [c.id, c.name]), d.collection)}</select></label></div>
        <div class="row"><label class="field"><span>Prix (FCFA) <em>*</em></span><input name="price" type="number" min="0" step="500" value="${d.price || ""}"></label>
          <label class="switch" style="align-self:end;padding-bottom:10px"><input type="checkbox" name="priceFrom" ${d.priceFrom ? "checked" : ""}>Prix « à partir de »</label></div>
        <label class="field"><span>Phrase d'accroche</span><input name="short" value="${esc(d.short)}" maxlength="200"></label>
        <label class="field"><span>Description détaillée</span><textarea name="description">${esc(d.description)}</textarea></label>
        <label class="field"><span>Confection et finitions (une ligne par point)</span><textarea name="details" style="min-height:100px">${esc((d.details || []).join("\n"))}</textarea></label>
        <div class="row"><label class="field"><span>Composition du tissu</span><input name="composition" value="${esc(d.composition)}"></label><label class="field"><span>Entretien</span><input name="care" value="${esc(d.care || "")}"></label></div>
      </div></div>
      <div class="panel"><h2>Tailles et couleurs</h2>
        <div class="field"><span>Tailles disponibles</span><div class="chips" id="psz">${SIZES.map((s) => `<button type="button" class="chip ${d.sizes.includes(s) ? "is-on" : ""}" data-sz="${esc(s)}">${esc(s)}</button>`).join("")}</div></div>
        <div class="field" style="margin-top:18px"><span>Couleurs disponibles</span><div id="pcol">${colorsHtml()}</div><button type="button" class="link" id="paddc">+ Ajouter une couleur</button></div></div>
      <div class="panel"><h2>Stock et visibilité</h2><div class="form">

          <label class="field"><span>Stock (vide = non suivi)</span><input name="stock" type="number" min="0" value="${typeof d.stock === "number" ? d.stock : ""}"></label>
          <label class="field"><span>Délai de confection (jours)</span><input name="delayDays" type="number" min="1" value="${d.delayDays || ""}"></label></div>

        <label class="field" style="max-width:200px"><span>Position dans la boutique</span><input name="order" type="number" value="${d.order ?? 0}"></label></div></div>

      `<div style="display:flex;gap:8px"><button class="btn btn--sm" id="psave">Enregistrer</button>${isNew ? "" : `<a class="btn btn--ghost btn--sm" href="index.html#/produit/${esc(d.slug || d.id)}" target="_blank">Voir sur le site</a>`}</div>${isNew ? "" : `<button class="btn btn--ghost btn--sm" id="pdel">Supprimer</button>`}`,

          $$("[data-rm]", root).forEach((b) => (b.onclick = () => { d.images.splice(Number(b.dataset.rm), 1); drawImgs(); }));
          $$("[data-mv]", root).forEach((b) => (b.onclick = () => { const i = Number(b.dataset.mv), j = i + Number(b.dataset.d); if (j < 0 || j >= d.images.length) return; [d.images[i], d.images[j]] = [d.images[j], d.images[i]]; drawImgs(); }));
          $("#pup", root).onchange = async (e) => {
            const files = [...e.target.files];
            for (const fl of files) {
              AB.toast(`Envoi de ${fl.name}…`, "info", 2000);
              try { d.images.push(await AB.upload(fl, "admirelle-b/produits")); drawImgs(); } catch (err) { AB.toast(err.message, "error"); }
            }
          };
        }
        function bindCols() {
          $$("[data-ch]", root).forEach((i) => (i.oninput = () => { d.colors[Number(i.dataset.ch)].hex = i.value; }));
          $$("[data-cn]", root).forEach((i) => (i.oninput = () => { d.colors[Number(i.dataset.cn)].name = i.value; }));
          $$("[data-cr]", root).forEach((b) => (b.onclick = () => { d.colors.splice(Number(b.dataset.cr), 1); drawCols(); }));
        }
        bindImgs(); bindCols();
        $("#paddurl", root).onclick = () => { const u = $("#purl", root).value.trim(); if (!/^https:\/\//.test(u)) return AB.toast("Adresse d'image invalide (https://…).", "error"); d.images.push(u); $("#purl", root).value = ""; drawImgs(); };
        $("#paddc", root).onclick = () => { d.colors.push({ name: "", hex: "#B9694B" }); drawCols(); };
        $$("[data-sz]", root).forEach((b) => (b.onclick = () => { const s = b.dataset.sz; d.sizes = d.sizes.includes(s) ? d.sizes.filter((x) => x !== s) : SIZES.filter((x) => x === s || d.sizes.includes(x)); b.classList.toggle("is-on"); }));
        $("#psave", root).onclick = async () => {
          const v = (n) => (pf.elements[n].value || "").trim();
          const ck = (n) => pf.elements[n].checked;
          const data = {
            ...d, name: v("name"), category: v("category"), collection: v("collection"), price: Math.round(Number(v("price")) || 0), priceFrom: ck("priceFrom"),
            short: v("short"), description: v("description"), details: v("details").split("\n").map((x) => x.trim()).filter(Boolean), composition: v("composition"), care: v("care"),
            availability: v("availability"), stock: v("stock") === "" ? null : Math.max(0, parseInt(v("stock"), 10) || 0), delayDays: parseInt(v("delayDays"), 10) || null,
            published: ck("published"), isNew: ck("isNew"), featured: ck("featured"), order: Number(v("order")) || 0,
            colors: d.colors.filter((c) => c.name.trim()).map((c) => ({ name: c.name.trim(), hex: c.hex }))
          };
          if (data.name.length < 2) return AB.toast("Indiquez le nom du modèle.", "error");
          if (!data.price) return AB.toast("Indiquez le prix.", "error");
          if (!data.sizes.length) return AB.toast("Choisissez au moins une taille.", "error");
          if (!data.colors.length) return AB.toast("Ajoutez au moins une couleur.", "error");
          if (!data.images.length && !confirm("Ce produit n'a pas de photo. Enregistrer quand même ?")) return;
          let id = p ? p.id : AB.slugify(data.name) || AB.uid(8);
          if (!p) { let k = 2; const base = id; while (ST.products.some((x) => x.id === id)) id = `${base}-${k++}`; data.createdAt = AB.isLive ? new Date() : Date.now(); }
          data.slug = id;
          const b = $("#psave", root); b.classList.add("is-loading");
          try { await AB.store.save("products", id, data); AB.toast("Produit enregistré.", "success"); closeSheet(); }
          catch (e) { AB.toast(e.message, "error"); } finally { b.classList.remove("is-loading"); }
        };
        const del = $("#pdel", root);
        if (del) del.onclick = async () => { if (confirm(`Supprimer « ${d.name} » ? Pensez plutôt à le masquer si vous voulez le remettre en ligne plus tard.`)) { await AB.store.remove("products", p.id); AB.toast("Produit supprimé."); closeSheet(); } };
      });
  }

    page("Messages", "", `<div class="panel" id="list"></div>`);
    listFn = () => {
      $("#list").innerHTML = ST.messages.length ? `<table class="tbl"><thead><tr><th>Date</th><th>De</th><th>Sujet</th><th>Message</th></tr></thead><tbody>${ST.messages.map((m) => `<tr class="click" data-msg="${esc(m.id)}"><td>${AB.date(m.createdAt, true)}</td><td>${m.lu ? "" : '<i class="dot-new"></i>'}<b>${esc(m.nom)}</b><div class="small muted">${esc(m.email)}</div></td><td>${esc(m.sujet)}</td><td class="small">${esc((m.message || "").slice(0, 90))}…</td></tr>`).join("")}</tbody></table>`
        : `<div class="empty-s">Aucun message.</div>`;
      $$("[data-msg]", $("#list")).forEach((t) => (t.onclick = () => {
        const m = ST.messages.find((x) => x.id === t.dataset.msg);
        if (!m.lu) AB.store.save("messages", m.id, { lu: true }).catch(() => {});
        openSheet(m.sujet || "Message", `<div class="panel"><dl class="kv"><dt>De</dt><dd>${esc(m.nom)}</dd><dt>E-mail</dt><dd>${esc(m.email)}</dd><dt>Téléphone</dt><dd>${esc(m.tel || "—")}</dd><dt>Reçu le</dt><dd>${AB.date(m.createdAt, true)}</dd></dl></div><div class="panel">${AB.nl2p(m.message)}</div>`,
          `<div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn--sm" href="mailto:${esc(m.email)}?subject=${encodeURIComponent("Re : " + (m.sujet || "votre message"))}">Répondre par e-mail</a>${m.tel ? `<a class="btn btn--ghost btn--sm" target="_blank" rel="noopener" href="${AB.wa(m.tel, `Bonjour ${first(m.nom)}, ici Admirelle B.`)}">WhatsApp</a>` : ""}</div><button class="btn btn--ghost btn--sm" id="mdel">Supprimer</button>`,
          (root) => { $("#mdel", root).onclick = async () => { if (confirm("Supprimer ce message ?")) { await AB.store.remove("messages", m.id); closeSheet(); } }; });
      }));
    };
    listFn();
  }

  /* =====================================================================
     CLIENTES
     ===================================================================== */
  async function customersView() {
    page("Clientes", "", `<div class="panel"><div class="bar"><input type="search" id="q" placeholder="Nom, e-mail, téléphone…"><span class="muted small" id="cnt"></span></div><div id="list"><div class="loading" style="min-height:200px">${AB.mono()}</div></div></div>`);
    try { ST.customers = await AB.store.list("customers"); } catch (e) { console.warn(e); ST.customers = []; }
    let q = "";
    $("#q").oninput = AB.debounce(() => { q = $("#q").value.toLowerCase(); listFn(); }, 150);
    listFn = () => {
      const map = new Map();
      const key = (email, tel) => (email || "").toLowerCase() || String(tel || "").replace(/\D/g, "");
      ST.customers.forEach((c) => map.set(key(c.email, c.phone), { id: c.id, nom: c.name, email: c.email, tel: c.phone, ville: c.city, compte: true, note: c.note || "", orders: [] }));
      ST.orders.forEach((o) => {
        const c = o.customer || {}, k = key(c.email, c.tel);
        if (!k) return;
        if (!map.has(k)) map.set(k, { nom: c.nom, email: c.email, tel: c.tel, ville: c.ville, compte: false, orders: [] });
        const e = map.get(k); e.orders.push(o); e.nom = e.nom || c.nom; e.tel = e.tel || c.tel; e.ville = e.ville || c.ville;
      });
      const rows = [...map.values()].filter((c) => !q || [c.nom, c.email, c.tel].join(" ").toLowerCase().includes(q))
        .map((c) => ({ ...c, spent: c.orders.filter((o) => (o.payment || {}).status === "payee").reduce((s, o) => s + o.total, 0), last: c.orders.length ? Math.max(...c.orders.map((o) => ts(o.createdAt))) : 0 }))
        .sort((a, b) => b.last - a.last);
      $("#cnt").textContent = `${rows.length} cliente(s)`;
      $("#list").innerHTML = rows.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Cliente</th><th>Contact</th><th>Commandes</th><th>Total payé</th><th>Dernière commande</th><th></th></tr></thead><tbody>
        ${rows.map((c, i) => `<tr class="click" data-cu="${i}"><td><b>${esc(c.nom || "—")}</b><div class="small muted">${c.compte ? "Compte cliente" : "Sans compte"}${c.ville ? ` · ${esc(c.ville)}` : ""}</div></td><td>${esc(c.email || "")}<div class="small muted">${esc(c.tel || "")}</div></td><td>${c.orders.length}</td><td>${money(c.spent)}</td><td>${c.last ? AB.date(c.last) : "—"}</td><td>${c.tel ? `<a class="link" href="${AB.wa(c.tel, `Bonjour ${first(c.nom)}, ici Admirelle B.`)}" target="_blank" onclick="event.stopPropagation()">WhatsApp</a>` : ""}</td></tr>`).join("")}</tbody></table></div>`
        : `<div class="empty-s">Les clientes apparaîtront ici après leur première commande ou inscription.</div>`;
      $$("[data-cu]", $("#list")).forEach((t) => (t.onclick = () => {
        const c = rows[Number(t.dataset.cu)];
        openSheet(c.nom || "Cliente", `<div class="panel"><dl class="kv"><dt>E-mail</dt><dd>${esc(c.email || "—")}</dd><dt>Téléphone</dt><dd>${esc(c.tel || "—")}</dd><dt>Ville</dt><dd>${esc(c.ville || "—")}</dd><dt>Total payé</dt><dd>${money(c.spent)}</dd></dl></div>
          <div class="panel"><h2>Commandes</h2>${ordersTable(c.orders.sort(byDate))}</div>
          ${c.compte ? `<div class="panel"><label class="field"><span>Note interne (préférences, mesures habituelles…)</span><textarea id="cnote">${esc(c.note)}</textarea></label></div>` : ""}`,
          c.compte ? `<button class="btn btn--sm" id="csv">Enregistrer la note</button>` : "",
          (root) => {
            bindOrderRows(root);
            const b = $("#csv", root);
            if (b) b.onclick = async () => { try { await AB.store.save("customers", c.id, { note: $("#cnote", root).value }); AB.toast("Note enregistrée.", "success"); } catch (e) { AB.toast(e.message, "error"); } };
          });
      }));
    };
    listFn();
  }

  /* =====================================================================
     PARAMÈTRES DU SITE
     ===================================================================== */
  function settingsView() {
    listFn = null;
    const s = JSON.parse(JSON.stringify(S()));
    const inp = (n, label, v, type = "text", ph = "") => `<label class="field"><span>${label}</span><input name="${n}" type="${type}" value="${esc(v || "")}" placeholder="${esc(ph)}"></label>`;
    const imgField = (n, label) => `<div class="field"><span>${label}</span><div class="imgs" style="grid-template-columns:140px 140px"><div class="im">${s[n] ? `<img src="${esc(img(s[n], 300))}" alt="">` : ""}</div><label class="add"><input type="file" accept="image/*" hidden data-img="${n}">${I.upload}<br>Remplacer</label></div></div>`;
    const shipHtml = () => s.shipping.map((z, i) => `<div class="shiprow"><input class="sz" data-k="label" data-i="${i}" value="${esc(z.label)}" placeholder="Zone"><input class="sz" data-k="fee" data-i="${i}" type="number" value="${z.fee || 0}" placeholder="Tarif"><input class="sz" data-k="delay" data-i="${i}" value="${esc(z.delay || "")}" placeholder="Délai"><label class="switch"><input type="checkbox" class="sz" data-k="quote" data-i="${i}" ${z.quote ? "checked" : ""}>Sur devis</label><button type="button" data-zr="${i}">✕</button></div>`).join("");
    page("Paramètres du site", `<button class="btn btn--sm" id="ssave">Enregistrer</button>`, `<form id="sf" class="form" novalidate>
      <div class="panel"><h2>Contact</h2><div class="form"><div class="row">${inp("whatsapp", "Numéro WhatsApp (chiffres, avec 229)", s.whatsapp, "text", "2290191999905")}${inp("phoneDisplay", "Téléphone affiché", s.phoneDisplay)}</div>
        <div class="row">${inp("email", "E-mail (reçoit aussi les notifications)", s.email, "email")}${inp("hours", "Horaires", s.hours)}</div>${inp("address", "Adresse de l'atelier (laisser vide pour « sur rendez-vous »)", s.address)}</div></div>
      <div class="panel"><h2>Réseaux sociaux</h2><div class="form"><div class="row3">${inp("instagram", "Instagram", s.socials.instagram, "url", "https://instagram.com/…")}${inp("facebook", "Facebook", s.socials.facebook, "url", "https://facebook.com/…")}${inp("tiktok", "TikTok", s.socials.tiktok, "url", "https://tiktok.com/@…")}</div></div></div>
      <div class="panel"><h2>Accueil</h2><div class="form">${inp("announcement", "Bandeau d'annonce", s.announcement)}${inp("heroKicker", "Sur-titre de l'accueil", s.heroKicker)}
        <label class="field"><span>Texte de présentation</span><textarea name="heroText">${esc(s.heroText)}</textarea></label><div class="row">${imgField("heroImage", "Grande image d'accueil")}${imgField("atelierImage", "Image de l'atelier")}</div></div></div>
      <div class="panel"><h2>À propos</h2><div class="form"><div class="row">${inp("designerName", "Nom de la styliste", s.designerName)}${inp("designerTitle", "Titre", s.designerTitle)}</div>
        <label class="field"><span>Histoire (paragraphes séparés par une ligne vide)</span><textarea name="aboutStory" style="min-height:180px">${esc(s.aboutStory)}</textarea></label>${imgField("aboutImage", "Portrait de la styliste")}</div></div>
      <div class="panel"><h2>Livraison</h2><p class="small muted" style="margin-bottom:12px">Zone · tarif en FCFA · délai indicatif. « Sur devis » : la commande se confirme sur WhatsApp.</p><div id="ship">${shipHtml()}</div><button type="button" class="link" id="zadd">+ Ajouter une zone</button></div>
    </form>`);
    const root = $("#sf");
    const bindShip = () => {
      $$(".sz", root).forEach((el) => (el.oninput = el.onchange = () => { const z = s.shipping[Number(el.dataset.i)]; const k = el.dataset.k; z[k] = k === "fee" ? Math.max(0, Number(el.value) || 0) : k === "quote" ? el.checked : el.value; }));
      $$("[data-zr]", root).forEach((b) => (b.onclick = () => { s.shipping.splice(Number(b.dataset.zr), 1); $("#ship").innerHTML = shipHtml(); bindShip(); }));
      $$(".shiprow input:not([type=checkbox])", root).forEach((i) => Object.assign(i.style, { border: "1px solid var(--line-strong)", padding: "9px 12px", borderRadius: "3px", background: "#fff", width: "100%" }));
    };
    bindShip();
    $("#zadd").onclick = () => { s.shipping.push({ id: "zone-" + AB.uid(4), label: "", fee: 0, delay: "" }); $("#ship").innerHTML = shipHtml(); bindShip(); };
    $$("[data-img]", root).forEach((i) => (i.onchange = async () => {
      try { const n = i.dataset.img; s[n] = await AB.upload(i.files[0], "admirelle-b/site"); i.closest(".imgs").querySelector(".im").innerHTML = `<img src="${esc(img(s[n], 300))}" alt="">`; AB.toast("Image prête : pensez à enregistrer."); } catch (e) { AB.toast(e.message, "error"); }
    }));
    $("#ssave").onclick = async () => {
      const v = (n) => (root.elements[n].value || "").trim();
      const data = {
        whatsapp: v("whatsapp").replace(/\D/g, ""), phoneDisplay: v("phoneDisplay"), email: v("email"), hours: v("hours"), address: v("address"),
        socials: { instagram: v("instagram"), facebook: v("facebook"), tiktok: v("tiktok") },
        announcement: v("announcement"), heroKicker: v("heroKicker"), heroText: v("heroText"), designerName: v("designerName"), designerTitle: v("designerTitle"), aboutStory: root.elements.aboutStory.value.trim(),
        heroImage: s.heroImage, atelierImage: s.atelierImage, aboutImage: s.aboutImage,
        shipping: s.shipping.filter((z) => z.label.trim()).map((z) => ({ id: z.id || AB.slugify(z.label), label: z.label.trim(), fee: z.fee || 0, delay: z.delay || "", ...(z.quote ? { quote: true } : {}) }))
      };
      if (data.whatsapp.length < 11) return AB.toast("Numéro WhatsApp : indiquez l'indicatif 229 suivi des 10 chiffres.", "error");
      try { await AB.store.save("settings", "site", data); ST.settings = await AB.data.settings(true); AB.toast("Paramètres enregistrés. Ils sont visibles sur le site.", "success"); } catch (e) { AB.toast(e.message, "error"); }
    };
  }

  const VIEWS = { dashboard, orders: ordersView, payments: paymentsView, products: productsView, collections: collectionsView, requests: requestsView, messages: messagesView, customers: customersView, settings: settingsView };
  document.addEventListener("DOMContentLoaded", boot);
})();

</script>
</body>
</html>
